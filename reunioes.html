<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Reuniões — Paralax Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.2/dist/socket.io.min.js"></script>
<style>
  /* Heroicons helper */
  .hi { display:inline-block; vertical-align:middle; flex-shrink:0; }
  .hi-dot { display:inline-block; width:9px; height:9px; border-radius:50%; flex-shrink:0; vertical-align:middle; }
/* ===== TOKENS ===== */
:root{
  --blue-deep:#0a2557; --blue-main:#1a56db; --blue-mid:#2563eb; --blue-light:#eff6ff; --blue-glow:rgba(26,86,219,.15);
  --white:#fff; --slate-900:#0f172a; --slate-800:#1e293b; --slate-700:#334155;
  --slate-600:#475569; --slate-500:#64748b; --slate-400:#94a3b8;
  --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9; --slate-50:#f8fafc;
  --green:#16a34a; --green-light:#dcfce7; --amber:#d97706; --amber-light:#fef3c7;
  --red:#dc2626; --red-light:#fee2e2;
  --thumb-h:110px;
  --font:'Plus Jakarta Sans',sans-serif; --font-alt:'Manrope',sans-serif;
  --radius:12px; --radius-sm:8px;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08); --shadow-md:0 4px 16px rgba(0,0,0,.1);
  --shadow-lg:0 10px 28px rgba(0,0,0,.14); --shadow-xl:0 24px 52px rgba(0,0,0,.2);
  --card-bg:rgba(255,255,255,.04); --card-border:rgba(255,255,255,.09);
  --card-hover-bg:rgba(255,255,255,.07); --card-hover-border:rgba(37,99,235,.45);
  --text-primary:#f1f5f9; --text-secondary:#94a3b8; --text-muted:rgba(255,255,255,.3);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:var(--font);background:#060d20;overflow:hidden;color:var(--slate-700);}

/* ===== NOTIF ===== */
#notif{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:6px;pointer-events:none;}
.notif-item{background:var(--white);border:1px solid var(--slate-200);color:var(--slate-800);font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;box-shadow:var(--shadow-md);animation:slideIn .2s ease;max-width:300px;pointer-events:all;}
.notif-item.warn{background:var(--amber-light);border-color:#f59e0b;}
.notif-item.success{background:var(--green-light);border-color:#16a34a;color:var(--green);}
.notif-item.error{background:var(--red-light);border-color:var(--red);color:var(--red);}
@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:none;}}

/* ===== LOADING ===== */
#loading{position:fixed;inset:0;background:rgba(6,13,32,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:8000;}
.spinner{width:38px;height:38px;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-txt{font-size:14px;color:rgba(255,255,255,.6);}

/* ===== APP ROOT ===== */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden;}

/* ===== DASHBOARD HEADER ===== */
#dash-header{
  display:flex;align-items:center;gap:12px;padding:12px 22px;
  background:linear-gradient(135deg,#060e24 0%,#0e1e48 100%);
  border-bottom:1px solid rgba(255,255,255,.07);
  flex-shrink:0;z-index:100;
}
.dh-brand{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.dh-logo-dot{width:9px;height:9px;border-radius:50%;background:var(--blue-main);box-shadow:0 0 10px rgba(26,86,219,.8);flex-shrink:0;}
.dh-logo-text{font-family:var(--font-alt);font-size:16px;font-weight:800;color:#fff;letter-spacing:-.3px;}
.dh-logo-sub{font-size:12px;color:rgba(255,255,255,.32);font-weight:500;}
.dh-vline{width:1px;height:20px;background:rgba(255,255,255,.1);flex-shrink:0;}
.dh-user{display:flex;align-items:center;gap:8px;}
.dh-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#1a3a6e,var(--blue-main));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;border:1.5px solid rgba(255,255,255,.18);}
.dh-user-nome{font-size:12px;font-weight:700;color:#dde6f3;white-space:nowrap;}
.dh-user-nivel{font-size:10px;color:rgba(255,255,255,.38);margin-top:1px;}
.dh-spacer{flex:1;}
.online-pill{display:flex;align-items:center;gap:6px;padding:5px 12px;background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.28);border-radius:20px;font-size:11px;font-weight:700;color:#4ade80;cursor:pointer;transition:all .15s;font-family:inherit;flex-shrink:0;}
.online-pill:hover{background:rgba(22,163,74,.2);}
.online-pill-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulseGreen 2s infinite;flex-shrink:0;}
@keyframes pulseGreen{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.35);opacity:.65;}}

/* ===== DASHBOARD SCROLL AREA ===== */
#dashboard{
  flex:1;overflow-y:auto;padding:26px 24px 96px;
  background:linear-gradient(180deg,#0b1427 0%,#060d20 100%);
  display:flex;flex-direction:column;gap:30px;
}
#dashboard::-webkit-scrollbar{width:5px;}
#dashboard::-webkit-scrollbar-thumb{background:rgba(255,255,255,.09);border-radius:4px;}
#dashboard::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.16);}

/* ===== DASH SECTIONS ===== */
.dash-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.dash-section-title{font-family:var(--font-alt);font-size:14px;font-weight:800;color:var(--text-primary);display:flex;align-items:center;gap:8px;}
.live-pill{display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:800;color:#f87171;background:rgba(220,38,38,.12);border:1px solid rgba(220,38,38,.22);padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.5px;}
.live-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:#f87171;display:block;animation:blink 1.2s ease infinite;}

/* ===== ROOMS GRID ===== */
#rooms-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}

/* Room card — dark dashboard */
.room-card{
  background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:16px;
  padding:16px 18px;cursor:pointer;position:relative;overflow:hidden;
  transition:transform .2s cubic-bezier(.4,0,.2,1),border-color .2s,box-shadow .2s;
  box-shadow:0 2px 14px rgba(0,0,0,.22);
}
.room-card:hover{
  transform:translateY(-3px);border-color:var(--card-hover-border);
  background:var(--card-hover-bg);box-shadow:0 8px 28px rgba(26,86,219,.18);
}
.room-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue-deep),var(--blue-main));opacity:0;transition:opacity .2s;}
.room-card:hover::before{opacity:1;}
.room-card-top{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px;}
.room-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,rgba(26,86,219,.25),rgba(37,99,235,.15));border:1px solid rgba(37,99,235,.25);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.room-name{font-family:var(--font-alt);font-size:14px;font-weight:800;color:var(--text-primary);margin-bottom:3px;line-height:1.3;}
.room-meta{font-size:11px;color:var(--text-secondary);line-height:1.5;}
.room-footer{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.room-actions{display:flex;gap:6px;align-items:center;}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-radius:20px;display:inline-flex;align-items:center;gap:3px;}
.badge-live{background:rgba(220,38,38,.13);color:#f87171;border:1px solid rgba(220,38,38,.2);}
.badge-live::before{content:'';width:5px;height:5px;border-radius:50%;background:#f87171;display:inline-block;animation:blink 1.2s ease infinite;}
.badge-regiao{background:rgba(26,86,219,.14);color:#93c5fd;border:1px solid rgba(37,99,235,.2);}

/* ===== AGENDA GRID ===== */
#agenda-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
.agenda-card{background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:14px;padding:14px 16px;transition:border-color .15s,background .15s;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.agenda-card:hover{border-color:rgba(37,99,235,.3);background:var(--card-hover-bg);}
.agenda-card.hoje{border-left:3px solid var(--blue-main);}
.agenda-data{font-size:10px;font-weight:800;color:#93c5fd;text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px;}
.agenda-nome{font-family:var(--font-alt);font-size:13px;font-weight:700;color:var(--text-primary);margin-bottom:5px;}
.agenda-info{font-size:11px;color:var(--text-secondary);display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.agenda-actions{display:flex;gap:6px;}

/* ===== ONLINE GRID ===== */
#online-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;}
.online-count-chip{font-size:11px;font-weight:700;color:#4ade80;background:rgba(22,163,74,.1);border:1px solid rgba(22,163,74,.22);padding:3px 10px;border-radius:20px;display:inline-flex;align-items:center;gap:5px;}
.online-count-chip::before{content:'';width:6px;height:6px;border-radius:50%;background:#4ade80;display:block;animation:pulseGreen 2s ease infinite;}
.user-online-card{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card-bg);border:1.5px solid var(--card-border);border-radius:12px;transition:all .15s;}
.user-online-card:hover{border-color:rgba(37,99,235,.35);background:var(--card-hover-bg);}
.user-online-avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;position:relative;}
.user-online-avatar::after{content:'';position:absolute;bottom:0;right:0;width:9px;height:9px;border-radius:50%;background:#4ade80;border:2px solid #0b1427;}
.user-card-nome{font-size:12px;font-weight:700;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.user-card-regiao{font-size:10px;color:var(--text-secondary);}

/* ===== EMPTY STATE ===== */
.empty-state{grid-column:1/-1;text-align:center;padding:36px 14px;}
.empty-icon{font-size:32px;margin-bottom:8px;opacity:.35;}
.empty-state p{font-size:13px;line-height:1.7;color:var(--text-muted);}

/* ===== SKELETON ===== */
@keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
.sk-card{border-radius:16px;background:linear-gradient(90deg,rgba(255,255,255,.04) 0%,rgba(255,255,255,.08) 50%,rgba(255,255,255,.04) 100%);background-size:200% 100%;animation:shimmer 1.6s infinite;border:1.5px solid var(--card-border);height:140px;}
.sk-agenda{height:110px;border-radius:14px;}
.sk-online{height:60px;border-radius:12px;}

/* ===== DASH ACTION BAR ===== */
#dash-action-bar{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 24px;
  background:rgba(11,20,38,.8);backdrop-filter:blur(10px);
  border-bottom:1px solid rgba(255,255,255,.06);
  flex-shrink:0;
}
.dash-action-title{font-size:12px;font-weight:600;color:var(--text-muted);}
.dash-action-btns{display:flex;gap:8px;align-items:center;}

/* ===== FAB (mobile only) ===== */
.fab{position:fixed;bottom:22px;right:20px;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,var(--blue-deep),var(--blue-main));color:#fff;font-size:26px;font-weight:300;border:none;cursor:pointer;z-index:300;box-shadow:0 6px 22px rgba(26,86,219,.5);display:none;align-items:center;justify-content:center;transition:all .2s;line-height:1;}
.fab:active{transform:scale(.88);}
.fab:hover{box-shadow:0 8px 30px rgba(26,86,219,.65);}

/* ===== BUTTONS ===== */
.btn{padding:8px 15px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;font-family:var(--font);border:none;cursor:pointer;transition:all .18s;white-space:nowrap;display:inline-flex;align-items:center;gap:5px;justify-content:center;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--blue-deep),var(--blue-main));color:#fff;box-shadow:0 2px 8px rgba(26,86,219,.3);}
.btn-primary:hover{box-shadow:0 4px 16px rgba(26,86,219,.45);transform:translateY(-1px);}
.btn-danger{background:var(--red);color:#fff;}
.btn-ghost{background:transparent;color:#93c5fd;border:1.5px solid rgba(37,99,235,.28);}
.btn-ghost:hover{background:rgba(37,99,235,.1);}
.btn-sm{padding:6px 12px;font-size:12px;}
.btn-xs{padding:4px 9px;font-size:11px;}
.btn-icon{width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-sm);font-size:13px;background:rgba(255,255,255,.06);color:#94a3b8;border:1px solid rgba(255,255,255,.1);cursor:pointer;transition:all .15s;font-family:inherit;font-weight:600;flex-shrink:0;}
.btn-icon:hover{background:rgba(37,99,235,.18);color:#93c5fd;border-color:rgba(37,99,235,.28);}

/* ===== LIDER INFO (modal) ===== */
.section-label{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:1px;color:var(--text-secondary);margin-bottom:10px;padding-left:2px;}
.lider-badge{font-size:10px;font-weight:600;color:var(--green);background:var(--green-light);padding:1px 7px;border-radius:20px;text-transform:none;letter-spacing:0;}
.lider-info{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--white);border:1.5px solid rgba(22,163,74,.25);border-radius:var(--radius-sm);margin-top:-3px;margin-bottom:13px;}
.lider-avatar{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#059669);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0;}

/* ===== VIDEO CONTAINER — WhatsApp-style fullscreen ===== */
#video-container{display:none;position:relative;overflow:hidden;}
#video-container.active{display:block;position:fixed;inset:0;z-index:500;background:#000;}

/* Background fullscreen video */
#vc-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;display:block;}
#vc-bg-avatar{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:linear-gradient(135deg,#0d1b3e,#1e293b);}
.vc-bg-circle{width:100px;height:100px;border-radius:50%;background:linear-gradient(135deg,var(--blue-deep),var(--blue-main));display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:800;color:#fff;box-shadow:0 0 0 4px rgba(37,99,235,.4);}
.vc-bg-name{font-size:15px;font-weight:700;color:rgba(255,255,255,.65);}

/* Local PiP (draggable, mirrored) */
#local-pip{
  position:absolute;bottom:130px;right:14px;
  width:88px;height:128px;border-radius:16px;overflow:hidden;
  border:2.5px solid rgba(255,255,255,.3);box-shadow:0 6px 24px rgba(0,0,0,.6);
  cursor:grab;z-index:20;touch-action:none;background:#1e293b;
  transition:border-color .2s,box-shadow .2s;
}
#local-pip:active{cursor:grabbing;border-color:rgba(37,99,235,.7);}
#local-pip video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);display:block;}
#pip-avatar{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d1b3e,#1e293b);}
.pip-letter{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--blue-deep),var(--blue-main));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;}

/* Auto-hide overlay */
#call-overlay{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s ease;z-index:10;}
#call-overlay.show{opacity:1;pointer-events:all;}

/* Top gradient (room name + actions) */
#overlay-top{
  position:absolute;top:0;left:0;right:0;
  padding:max(env(safe-area-inset-top,0px),16px) 16px 50px;
  background:linear-gradient(180deg,rgba(0,0,0,.78) 0%,transparent 100%);
  display:flex;align-items:flex-start;gap:10px;
}
.ov-room-name{font-family:var(--font-alt);font-size:17px;font-weight:800;color:#fff;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ov-room-meta{font-size:12px;color:rgba(255,255,255,.5);margin-top:3px;}
.ov-top-right{display:flex;align-items:center;gap:8px;flex-shrink:0;}
.ov-icon-btn{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.16);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .15s;font-family:inherit;}
.ov-icon-btn:hover{background:rgba(255,255,255,.28);}

/* Quality badge */
.quality-badge{display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid;backdrop-filter:blur(8px);}
.quality-good{background:rgba(22,163,74,.18);border-color:rgba(22,163,74,.4);color:#4ade80;}
.quality-medium{background:rgba(217,119,6,.18);border-color:rgba(217,119,6,.4);color:#fbbf24;}
.quality-bad{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.4);color:#f87171;}
.quality-bars{display:flex;align-items:flex-end;gap:2px;height:12px;}
.quality-bars span{width:3px;border-radius:1px;display:block;}

/* Participants strip (inside overlay, below top) */
#thumb-strip{
  position:absolute;top:88px;left:0;right:0;height:88px;
  display:flex;align-items:center;gap:6px;
  padding:0 14px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
}
#thumb-strip::-webkit-scrollbar{display:none;}
#thumb-strip.grid-mode{top:88px;height:calc(100% - 220px);flex-wrap:wrap;align-content:flex-start;overflow-y:auto;overflow-x:hidden;padding:10px 14px;}
#thumb-strip.grid-mode .thumb-tile{width:calc(50% - 5px);height:130px;}
.thumb-tile{flex-shrink:0;width:68px;height:80px;border-radius:10px;overflow:hidden;border:2px solid transparent;cursor:pointer;position:relative;background:#1e293b;transition:border-color .2s,transform .15s;}
.thumb-tile:hover{border-color:rgba(37,99,235,.55);}
.thumb-tile.speaking{border-color:#4ade80;}
.thumb-tile.spotlight-active{border-color:var(--blue-main);box-shadow:0 0 0 1px var(--blue-main);}
.thumb-tile video{width:100%;height:100%;object-fit:cover;display:block;}
.thumb-avatar{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d1b3e,#1e293b);}
.thumb-avatar-circle{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--blue-deep),var(--blue-main));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;}
.thumb-label{position:absolute;bottom:0;left:0;right:0;font-size:9px;font-weight:700;color:#fff;text-align:center;padding:2px 3px 3px;background:linear-gradient(0deg,rgba(0,0,0,.7),transparent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* Hand raised */
#mao-aviso{position:absolute;top:185px;left:50%;transform:translateX(-50%);display:none;font-size:12px;font-weight:700;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.3);padding:4px 14px;border-radius:20px;animation:pulse 1.5s infinite;white-space:nowrap;backdrop-filter:blur(8px);}

/* Bottom gradient + controls */
#overlay-bottom{
  position:absolute;bottom:0;left:0;right:0;
  padding:50px 20px max(env(safe-area-inset-bottom,0px),14px);
  background:linear-gradient(0deg,rgba(0,0,0,.82) 0%,transparent 100%);
}
#secondary-controls{display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:14px;}
#primary-controls{display:flex;align-items:center;justify-content:center;gap:28px;}

/* Control buttons */
.ctrl-btn{display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:none;cursor:pointer;padding:4px;font-family:var(--font);}
.ctrl-btn:active .ctrl-circle{transform:scale(.91);}
.ctrl-circle{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.17);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.22);transition:background .15s,transform .12s;flex-shrink:0;}
.ctrl-btn:hover .ctrl-circle{background:rgba(255,255,255,.28);}
.ctrl-circle.off{background:rgba(234,67,53,.8);border-color:rgba(234,67,53,.4);}
.ctrl-circle.active{background:rgba(26,115,232,.8);border-color:rgba(26,115,232,.4);}
.ctrl-circle.rec{background:rgba(234,67,53,.8);border-color:rgba(234,67,53,.4);animation:recPulse 1.8s ease infinite;}
@keyframes recPulse{0%,100%{box-shadow:0 0 0 0 rgba(234,67,53,.5);}60%{box-shadow:0 0 0 8px rgba(234,67,53,0);}}
.ctrl-btn:hover .ctrl-circle.off{background:rgba(198,40,40,.9);}
.ctrl-btn:hover .ctrl-circle.active{background:rgba(21,87,176,.9);}
.ctrl-circle .material-icons-round{font-size:22px;color:#fff;user-select:none;}
.ctrl-label{font-size:10px;color:rgba(255,255,255,.75);white-space:nowrap;font-weight:500;}
.ctrl-btn.leave .ctrl-circle{background:rgba(234,67,53,.88);border-color:rgba(234,67,53,.4);width:60px;height:60px;}
.ctrl-btn.leave:hover .ctrl-circle{background:rgba(198,40,40,.95);}
.ctrl-btn.leave .ctrl-circle .material-icons-round{font-size:26px;}

/* Chat panel (side overlay) */
#chat-panel{position:absolute;top:0;right:0;bottom:0;width:0;overflow:hidden;display:flex;flex-direction:column;background:rgba(15,23,42,.96);backdrop-filter:blur(18px);transition:width .25s cubic-bezier(.4,0,.2,1);z-index:30;border-left:1px solid rgba(255,255,255,.07);}
#chat-panel.open{width:280px;}
.chat-header{padding:11px 13px;font-size:13px;font-weight:700;font-family:var(--font-alt);border-bottom:1px solid rgba(255,255,255,.07);color:#e2e8f0;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;}
.chat-close-btn{width:26px;height:26px;border:none;background:rgba(255,255,255,.07);color:#94a3b8;border-radius:6px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s;}
.chat-close-btn:hover{background:rgba(255,255,255,.14);color:#e2e8f0;}
#chat-msgs{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:8px;}
#chat-msgs::-webkit-scrollbar{width:3px;}
#chat-msgs::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:4px;}
.msg-wrap{display:flex;flex-direction:column;gap:2px;}
.msg-nome{font-size:11px;font-weight:700;color:#93c5fd;}
.msg-texto{font-size:12px;color:#cbd5e1;line-height:1.55;background:rgba(255,255,255,.05);padding:6px 9px;border-radius:4px 10px 10px 10px;}
.msg-wrap.me .msg-nome{color:#86efac;text-align:right;}
.msg-wrap.me .msg-texto{background:rgba(37,99,235,.2);border-radius:10px 4px 10px 10px;}
.msg-hora{font-size:9px;color:rgba(255,255,255,.25);}
.chat-input-area{display:flex;gap:6px;padding:9px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.06);background:rgba(15,23,42,.9);}
.chat-input-area input{flex:1;background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);color:#e2e8f0;font-size:13px;padding:8px 10px;border-radius:var(--radius-sm);outline:none;font-family:var(--font);}
.chat-input-area input:focus{border-color:var(--blue-mid);}
.chat-send{background:var(--blue-main);border:none;color:#fff;padding:8px 11px;border-radius:var(--radius-sm);cursor:pointer;font-size:15px;transition:all .15s;flex-shrink:0;}
.chat-send:hover{background:#1d4ed8;}
#chat-unread{display:none;background:var(--red);color:#fff;font-size:9px;font-weight:800;padding:1px 5px;border-radius:20px;line-height:1.4;margin-left:4px;}

/* ===== ANIMATIONS ===== */
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.22;}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1;}50%{transform:scale(1.3);opacity:.7;}}

/* ===== MODAL ===== */
.modal-overlay{position:fixed;inset:0;background:rgba(6,13,32,.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:3000;padding:16px;}
.modal-card{background:var(--white);border-radius:16px;padding:22px;width:440px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-xl);position:relative;}
.modal-title{font-family:var(--font-alt);font-size:15px;font-weight:800;color:var(--slate-900);margin-bottom:16px;}
.modal-card label{font-size:10px;font-weight:700;color:var(--slate-500);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.6px;}
.modal-card input,.modal-card select,.modal-card textarea{width:100%;padding:9px 11px;border-radius:var(--radius-sm);border:1.5px solid var(--slate-200);font-size:13px;font-family:inherit;outline:none;background:var(--slate-50);color:var(--slate-900);margin-bottom:13px;transition:border-color .2s,box-shadow .2s;}
.modal-card input:focus,.modal-card select:focus,.modal-card textarea:focus{border-color:var(--blue-main);box-shadow:0 0 0 3px var(--blue-glow);background:#fff;}
.modal-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:4px;}
.modal-close-btn{position:absolute;top:12px;right:12px;background:var(--slate-100);border:none;border-radius:var(--radius-sm);width:28px;height:28px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--slate-600);}
.participante-item{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--slate-50);border-radius:var(--radius-sm);margin-bottom:5px;border:1.5px solid transparent;cursor:pointer;transition:all .15s;}
.participante-item:hover{border-color:rgba(26,86,219,.25);background:var(--blue-light);}
.participante-check{width:15px;height:15px;accent-color:var(--blue-main);cursor:pointer;flex-shrink:0;}
.divider{height:1px;background:var(--slate-100);margin:4px 0 13px;}

/* ===== TOAST CONVITE ===== */
#convite-toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;border:1.5px solid rgba(37,99,235,.5);border-radius:12px;padding:14px 18px;min-width:280px;max-width:340px;z-index:5000;box-shadow:0 8px 28px rgba(0,0,0,.4);display:none;opacity:0;transition:all .3s;text-align:center;}
#convite-toast.show{display:block;opacity:1;transform:translateX(-50%) translateY(0);}
.convite-de{font-size:12px;color:#93c5fd;font-weight:600;margin-bottom:6px;}
.convite-sala{font-size:14px;font-weight:800;color:#f1f5f9;margin-bottom:12px;}
.convite-btns{display:flex;gap:8px;justify-content:center;}
.convite-btn{padding:7px 18px;border-radius:8px;font-size:12px;font-weight:700;border:none;cursor:pointer;font-family:var(--font);transition:all .15s;}
.convite-btn.aceitar{background:var(--blue-main);color:#fff;}
.convite-btn.aceitar:hover{background:#1d4ed8;}
.convite-btn.recusar{background:rgba(255,255,255,.07);color:#94a3b8;border:1px solid rgba(255,255,255,.1);}
.convite-btn.recusar:hover{background:rgba(255,255,255,.14);}

/* ===== RESPONSIVE ===== */
@media(max-width:768px){
  #dash-header{padding:10px 14px;gap:8px;}
  .dh-logo-sub,.dh-vline,.dh-user-nivel{display:none;}
  .dh-new-btn-text{display:none;}
  #dash-action-bar{padding:8px 14px;}
  .dash-action-title{display:none;}
  #dashboard{padding:16px 14px 88px;}
  #rooms-grid,#agenda-grid{grid-template-columns:1fr;}
  #online-grid{grid-template-columns:1fr 1fr;}
  .fab{display:flex;}
  #chat-panel.open{width:100%;}
  #local-pip{width:72px;height:104px;bottom:120px;right:12px;}
  #thumb-strip{top:76px;height:76px;}
  .thumb-tile{width:58px;height:68px;}
  .ctrl-circle{width:48px;height:48px;}
  .ctrl-btn.leave .ctrl-circle{width:56px;height:56px;}
  #secondary-controls{gap:14px;}
  #primary-controls{gap:20px;}
}
@media(max-width:480px){
  #online-grid{grid-template-columns:1fr;}
}
@media(max-width:380px){
  .ctrl-circle{width:44px;height:44px;}
  .ctrl-circle .material-icons-round{font-size:20px;}
  .ctrl-btn.leave .ctrl-circle{width:52px;height:52px;}
  #local-pip{width:64px;height:92px;}
}
</style>
</head>
<body>

<div id="loading"><div class="spinner"></div><div class="loading-txt">Carregando...</div></div>
<div id="notif"></div>

<!-- TOAST CONVITE -->
<div id="convite-toast">
  <div class="convite-de" id="convite-de-txt"></div>
  <div class="convite-sala" id="convite-sala-txt"></div>
  <div class="convite-btns">
    <button class="convite-btn aceitar" id="convite-aceitar">Entrar na sala</button>
    <button class="convite-btn recusar" onclick="fecharConviteToast()">Agora não</button>
  </div>
</div>

<!-- FAB — aparece no mobile para criar sala -->
<button class="fab" id="fab-nova" onclick="abrirModalCriar()" title="Nova reunião" style="display:none">+</button>

<div id="app">

  <!-- ======= HEADER DO DASHBOARD ======= -->
  <div id="dash-header">
    <div class="dh-brand">
      <div class="dh-logo-dot"></div>
      <span class="dh-logo-text">Paralax</span>
      <span class="dh-logo-sub">Reuniões</span>
    </div>
    <div class="dh-vline"></div>
    <div class="dh-user">
      <div class="dh-avatar" id="avatar-ini"></div>
      <div>
        <div class="dh-user-nome" id="user-nome"></div>
        <div class="dh-user-nivel" id="user-nivel"></div>
      </div>
    </div>
    <div class="dh-spacer"></div>
    <button class="online-pill" id="online-pill-btn" onclick="document.getElementById('online-grid').scrollIntoView({behavior:'smooth'})">
      <span class="online-pill-dot"></span>
      <span id="online-pill-count">0 online</span>
    </button>
  </div><!-- /dash-header -->

  <!-- ======= ACTION BAR ======= -->
  <div id="dash-action-bar">
    <span class="dash-action-title">Videoconferências Paralax</span>
    <div class="dash-action-btns">
      <button class="btn btn-ghost btn-sm" onclick="abrirModalAgendar()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"/></svg> Agendar</button>
      <button class="btn btn-primary btn-sm" id="dh-new-btn" onclick="abrirModalCriar()" style="display:none">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg> <span class="dh-new-btn-text">Nova reunião</span>
      </button>
    </div>
  </div>

  <!-- ======= DASHBOARD ======= -->
  <div id="dashboard">

    <!-- Salas ao vivo -->
    <div class="dash-section">
      <div class="dash-section-header">
        <div class="dash-section-title">
          <span class="live-pill">Ao vivo</span>
          Salas ativas
        </div>
      </div>
      <div id="rooms-grid">
        <div class="sk-card"></div>
        <div class="sk-card"></div>
        <div class="sk-card"></div>
      </div>
    </div>

    <!-- Próximas reuniões -->
    <div class="dash-section">
      <div class="dash-section-header">
        <div class="dash-section-title"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"/></svg> Próximas reuniões</div>
        <button class="btn btn-ghost btn-sm" onclick="abrirModalAgendar()">+ Agendar</button>
      </div>
      <div id="agenda-grid">
        <div class="sk-card sk-agenda"></div>
        <div class="sk-card sk-agenda"></div>
      </div>
    </div>

    <!-- Online agora -->
    <div class="dash-section">
      <div class="dash-section-header">
        <div class="dash-section-title">
          Online agora
          <span class="online-count-chip" id="online-count-chip">0 online</span>
        </div>
      </div>
      <div id="online-grid">
        <div class="sk-card sk-online"></div>
        <div class="sk-card sk-online"></div>
        <div class="sk-card sk-online"></div>
      </div>
    </div>

  </div><!-- /dashboard -->

  <!-- ======= VIDEO CONTAINER (WhatsApp-style) ======= -->
  <div id="video-container">

    <!-- Fullscreen background video (spotlight participant) — sempre muted no Android; áudio vai para #remote-audio -->
    <video id="vc-bg" autoplay muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5"></video>
    <!-- Elemento de áudio oculto para o participante em destaque (sem restrição de autoplay no Android) -->
    <audio id="remote-audio" autoplay style="display:none"></audio>
    <!-- Overlay tap-to-play para Android (aparece quando autoplay é bloqueado) -->
    <div id="tap-to-play" style="display:none;position:absolute;inset:0;z-index:10;align-items:center;justify-content:center;background:rgba(0,0,0,0.45);flex-direction:column;gap:12px;cursor:pointer;">
      <div style="width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,0.18);border:2px solid rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center;">
        <svg viewBox="0 0 24 24" fill="white" width="32" height="32"><path d="M8 5v14l11-7z"/></svg>
      </div>
      <span style="color:#fff;font-size:14px;font-family:inherit;font-weight:600;text-shadow:0 1px 4px rgba(0,0,0,0.6)">Toque para ativar o vídeo</span>
    </div>
    <!-- Avatar fallback when no video -->
    <div id="vc-bg-avatar">
      <div class="vc-bg-circle" id="vc-bg-avatar-letter"></div>
      <div class="vc-bg-name" id="vc-bg-avatar-name"></div>
    </div>

    <!-- Draggable local camera PiP (mirrored, like WhatsApp) -->
    <div id="local-pip">
      <video id="pip-vid" autoplay muted playsinline webkit-playsinline x5-playsinline></video>
      <div id="pip-avatar"><div class="pip-letter" id="pip-letter"></div></div>
    </div>

    <!-- Auto-hide overlay (tap/click to show, auto-hides after 4s) -->
    <div id="call-overlay">

      <!-- Top gradient: room name + actions -->
      <div id="overlay-top">
        <div style="flex:1;min-width:0">
          <div class="ov-room-name" id="sala-nome-h"></div>
          <div class="ov-room-meta" id="sala-meta-h"></div>
        </div>
        <div class="ov-top-right">
          <div id="quality-badge" style="display:none" class="quality-badge quality-good">
            <div class="quality-bars">
              <span style="height:4px;background:currentColor" id="qb1"></span>
              <span style="height:7px;background:currentColor" id="qb2"></span>
              <span style="height:10px;background:currentColor" id="qb3"></span>
            </div>
            <span id="quality-txt">Boa</span>
          </div>
          <button class="ov-icon-btn" id="btn-layout" onclick="toggleLayout();showOverlay()" title="Alternar layout">⊞</button>
          <button class="ov-icon-btn" id="btn-convidar-sala" onclick="abrirConvidar(salaAtualId,salaAtual)" title="Convidar"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg></button>
        </div>
      </div>

      <!-- Participants strip (remote peers as small tiles) -->
      <div id="thumb-strip"></div>

      <!-- Hand raised indicator -->
      <div id="mao-aviso"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M10.05 4.575a1.575 1.575 0 1 0-3.15 0v3m3.15-3v-1.5a1.575 1.575 0 0 1 3.15 0v1.5m-3.15 0 .075 5.925m3.075.75V4.575m0 0a1.575 1.575 0 0 1 3.15 0V15M6.9 7.575a1.575 1.575 0 1 0-3.15 0v8.175a6.75 6.75 0 0 0 6.75 6.75h2.018a5.25 5.25 0 0 0 3.712-1.538l1.732-1.732a5.25 5.25 0 0 0 1.538-3.712l.003-2.024a.668.668 0 0 1 .198-.471 1.575 1.575 0 1 0-2.228-2.228 3.818 3.818 0 0 0-1.12 2.687M6.9 7.575V12m6.27 4.318A4.49 4.49 0 0 1 16.35 15m.002 0h-.002"/></svg> <span id="mao-txt"></span></div>

      <!-- Bottom gradient: secondary + primary controls -->
      <div id="overlay-bottom">
        <div id="secondary-controls">
          <button class="ctrl-btn" id="btn-tela" onclick="toggleTela()" title="Compartilhar tela">
            <div class="ctrl-circle" id="btn-tela-circle"><span class="material-icons-round">present_to_all</span></div>
            <span class="ctrl-label" id="btn-tela-label">Tela</span>
          </button>
          <button class="ctrl-btn" id="btn-mao" onclick="toggleMao()" title="Levantar mão">
            <div class="ctrl-circle" id="btn-mao-circle"><span class="material-icons-round">back_hand</span></div>
            <span class="ctrl-label" id="btn-mao-label">Mão</span>
          </button>
          <button class="ctrl-btn" id="btn-chat" onclick="toggleChat()" title="Chat">
            <div class="ctrl-circle" id="btn-chat-circle"><span class="material-icons-round">chat_bubble</span></div>
            <span class="ctrl-label">Chat<span id="chat-unread"></span></span>
          </button>
          <button class="ctrl-btn" id="btn-rec" onclick="toggleGravacao()" title="Gravar reunião">
            <div class="ctrl-circle" id="btn-rec-circle"><span class="material-icons-round" id="rec-icon">radio_button_checked</span></div>
            <span class="ctrl-label" id="btn-rec-label">Gravar</span>
          </button>
        </div>
        <div id="primary-controls">
          <button class="ctrl-btn" id="btn-mic" onclick="toggleMic()" title="Microfone">
            <div class="ctrl-circle" id="btn-mic-circle"><span class="material-icons-round">mic</span></div>
            <span class="ctrl-label" id="btn-mic-label">Mic</span>
          </button>
          <button class="ctrl-btn leave" onclick="sairDaSala()" title="Encerrar chamada">
            <div class="ctrl-circle"><span class="material-icons-round">call_end</span></div>
          </button>
          <button class="ctrl-btn" id="btn-cam" onclick="toggleCam()" title="Câmera">
            <div class="ctrl-circle" id="btn-cam-circle"><span class="material-icons-round">videocam</span></div>
            <span class="ctrl-label" id="btn-cam-label">Câmera</span>
          </button>
        </div>
      </div>

    </div><!-- /call-overlay -->

    <!-- Chat panel (slide from right) -->

<script>
const API_URL = 'https://map-backend-j88s.onrender.com';

// ── ICE / TURN ───────────────────────────────────────────────────────────────
// Fallback público quando o backend não devolve credenciais CF
const ICE_FALLBACK = [
  { urls: 'stun:stun.l.google.com:19302' },
  { urls: 'stun:stun1.l.google.com:19302' },
  { urls: 'stun:stun.cloudflare.com:3478' },
  // TCP primeiro nas tentativas TURN: redes mobile bloqueiam UDP mas raramente TCP 443
  { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turns:openrelay.metered.ca:443',              username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:443',               username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:80',                username: 'openrelayproject', credential: 'openrelayproject' },
  { urls: 'turn:openrelay.metered.ca:80?transport=tcp',  username: 'openrelayproject', credential: 'openrelayproject' },
];
let _iceCache = null, _iceCacheTs = 0;

async function getIceServers() {
  const now = Date.now();
  if (_iceCache && now - _iceCacheTs < 23 * 3600_000) return _iceCache;
  try {
    // API_URL = 'https://...onrender.com' (sem /api nesta página)
    const res = await fetch(API_URL + '/api/turn-credentials', {
      headers: { Authorization: 'Bearer ' + (localStorage.getItem('token') || '') }
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const { iceServers, fonte } = await res.json();
    _iceCache   = iceServers || ICE_FALLBACK;
    _iceCacheTs = now;
    const hasTurn = _iceCache.some(s => [s.urls].flat().some(u => /^turns?:/.test(u)));
    console.log('[TURN] fonte=' + (fonte || '?') + ' hasTurn=' + hasTurn);
    notif('🔗 TURN: ' + (fonte === 'cloudflare' ? 'Cloudflare ✓' : 'Open Relay'), hasTurn ? 'success' : 'warn');
    return _iceCache;
  } catch (e) {
    console.warn('[TURN] fallback:', e.message);
    notif('⚠️ TURN: fallback (verifique credenciais CF)', 'warn');
    _iceCache   = ICE_FALLBACK;
    _iceCacheTs = now;
    return _iceCache;
  }
}

/* ====== ESTADO ====== */

/* ====== DRAGGABLE PIP ====== */
function initPipDrag() {
  const pip = document.getElementById('local-pip');
  if (!pip) return;
  // Reset to default position
  pip.style.cssText = '';
  let dragging = false, startX, startY, origLeft, origTop;

  function onDown(e) {
    dragging = true;
    const p = e.touches ? e.touches[0] : e;
    startX = p.clientX; startY = p.clientY;
    const rect = pip.getBoundingClientRect();
    origLeft = rect.left; origTop = rect.top;
    pip.style.transition = 'none';
    pip.style.right = 'auto'; pip.style.bottom = 'auto';
    pip.style.left = origLeft + 'px'; pip.style.top = origTop + 'px';
    e.stopPropagation();
  }
  function onMove(e) {
    if (!dragging) return;
    const p = e.touches ? e.touches[0] : e;
    const dx = p.clientX - startX, dy = p.clientY - startY;
    const vc = document.getElementById('video-container');
    const vcR = vc.getBoundingClientRect();
    const newLeft = Math.max(8, Math.min(origLeft + dx, vcR.width  - pip.offsetWidth  - 8));
    const newTop  = Math.max(8, Math.min(origTop  + dy, vcR.height - pip.offsetHeight - 8));
    pip.style.left = newLeft + 'px'; pip.style.top = newTop + 'px';
    e.preventDefault();
  }
  function onUp() { dragging = false; }

  pip.addEventListener('mousedown',  onDown);
  pip.addEventListener('touchstart', onDown, { passive: false });
  document.addEventListener('mousemove',  onMove);
  document.addEventListener('touchmove',  onMove, { passive: false });
  document.addEventListener('mouseup',  onUp);
  document.addEventListener('touchend', onUp);
}

/* ====== INIT ====== */
async function init() {
  accessToken = localStorage.getItem('token');
  const userStr = localStorage.getItem('user');
  if (!accessToken || !userStr) { window.location.href = '/index.html'; return; }
  try {
    let r = await fetch(API_URL + '/api/validar-token', { headers: { Authorization: 'Bearer ' + accessToken } });
    if (!r.ok) {
      const rt = localStorage.getItem('refreshToken');
      if (!rt) { localStorage.clear(); window.location.href = '/index.html'; return; }
      const r2 = await fetch(API_URL + '/api/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refreshToken: rt }) });
      if (!r2.ok) { localStorage.clear(); window.location.href = '/index.html'; return; }
      accessToken = (await r2.json()).accessToken;
      localStorage.setItem('token', accessToken);
    }
    usuario = JSON.parse(userStr);
    const ini = (usuario.nome || 'U')[0].toUpperCase();
    document.getElementById('avatar-ini').textContent = ini;
    document.getElementById('user-nome').textContent = usuario.nome || '';
    document.getElementById('user-nivel').textContent = ({ dono: 'Dono', admin: 'Admin', lider_regiao: 'Líder de Região', visualizador: 'Visualizador' }[usuario.nivel]) || usuario.nivel || '';
    if (['dono', 'admin', 'lider_regiao'].includes(usuario.nivel)) {
      document.getElementById('dh-new-btn').style.removeProperty('display'); // mostra na action bar
      document.getElementById('fab-nova').style.display = 'flex'; // FAB mobile
    }
    await carregarRegioes();
    conectarSocket();
    await carregarSalas();
    renderAgenda();
    verificarNotificacoes();
    setInterval(verificarNotificacoes, 60000);
    document.getElementById('loading').style.display = 'none';
  } catch (e) { console.error(e); setTimeout(() => window.location.href = '/index.html', 1500); }
}

/* ====== REGIÕES ====== */
async function carregarRegioes() {
  try {
    let regioes = [];
    if (usuario.nivel === 'dono') {
      const r = await fetch(API_URL + '/api/usuarios', { headers: { Authorization: 'Bearer ' + accessToken } });
      if (r.ok) { const users = await r.json(); regioes = [...new Set(users.map(u => u.regiao_vinculada).filter(Boolean))].sort(); }
    }
    if (!regioes.length && usuario.regiao_vinculada) regioes = [usuario.regiao_vinculada];
    if (!regioes.length) {
      const r2 = await fetch(API_URL + '/api/salas-video', { headers: { Authorization: 'Bearer ' + accessToken } });
      if (r2.ok) { const salas = await r2.json(); regioes = [...new Set(salas.map(s => s.regiao).filter(Boolean))].sort(); }
    }
    regioesDisponiveis = regioes;
    preencherSelects(regioes);
  } catch (e) {
    if (usuario.regiao_vinculada) { regioesDisponiveis = [usuario.regiao_vinculada]; preencherSelects([usuario.regiao_vinculada]); }
  }
}

function preencherSelects(regioes) {
  ['input-regiao-sala', 'ag-regiao'].forEach(id => {
    const sel = document.getElementById(id); if (!sel) return;
    while (sel.options.length > 1) sel.remove(1);
    regioes.forEach(r => { const op = document.createElement('option'); op.value = r; op.textContent = r; sel.appendChild(op); });
    if (usuario.regiao_vinculada && regioes.includes(usuario.regiao_vinculada)) sel.value = usuario.regiao_vinculada;
  });
  if (usuario.nivel === 'lider_regiao' && usuario.regiao_vinculada) aoSelecionarRegiao(usuario.regiao_vinculada);
}

async function aoSelecionarRegiao(regiao) {
  const box = document.getElementById('lider-info-box');
  const badge = document.getElementById('lider-badge');
  if (!regiao) { box.style.display = 'none'; badge.style.display = 'none'; return; }
  try {
    const r = await fetch(API_URL + '/api/lider-regiao/' + encodeURIComponent(regiao), { headers: { Authorization: 'Bearer ' + accessToken } });
    if (!r.ok) { box.style.display = 'none'; badge.style.display = 'none'; return; }
    const lider = await r.json();
    if (lider && lider.nome) {
      document.getElementById('lider-avatar-ini').textContent = (lider.nome || 'L')[0].toUpperCase();
      document.getElementById('lider-nome-txt').textContent = lider.nome;
      box.style.display = 'flex'; badge.style.display = 'inline-flex';
    } else { box.style.display = 'none'; badge.style.display = 'none'; }
  } catch { box.style.display = 'none'; badge.style.display = 'none'; }
}

/* ====== SOCKET ====== */
function conectarSocket() {
  socket = io(API_URL, { auth: { token: accessToken }, transports: ['websocket', 'polling'] });

  // Já estava na sala — cria PC e envia offer para cada peer existente
  socket.on('peers-existentes', async lista => {
    for (const { peerId, nome } of lista) {
      peerNomes[peerId] = nome;
      await criarPC(peerId, true);
    }
  });

  // Novo peer chegou — só armazena o nome; PC será criado quando o offer chegar
  socket.on('novo-peer', ({ peerId, nome }) => { peerNomes[peerId] = nome; });

  // Recebemos um offer → criamos PC limpo, respondemos com answer
  socket.on('offer', async ({ deId, nome, offer }) => {
    peerNomes[deId] = nome;
    const pc = await criarPC(deId, false);
    try {
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      await flushIceCandidates(deId);
      const answer    = await pc.createAnswer();
      // Garante que o answer também prefere VP8 (pode não herdar a preferência do offer no Android antigo)
      const sdpMod    = preferCodecInSdp(answer.sdp, 'VP8');
      await pc.setLocalDescription({ type: 'answer', sdp: sdpMod });
      socket.emit('answer', { paraId: deId, answer: pc.localDescription });
    } catch (e) {
      console.error('[offer] erro:', e);
    }
  });

  // Recebemos answer → seta remote description e libera candidatos em buffer
  socket.on('answer', async ({ deId, answer }) => {
    const pc = peers[deId];
    if (!pc) return;
    try {
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
      await flushIceCandidates(deId);
    } catch (e) {
      console.warn('[answer] erro:', e);
    }
  });

  // Candidato ICE — aplica ou guarda em buffer se remote description ainda não chegou
  socket.on('ice-candidate', async ({ deId, candidate }) => {
    if (!candidate) return;
    const pc = peers[deId];
    if (pc?.remoteDescription) {
      try { await pc.addIceCandidate(new RTCIceCandidate(candidate)); } catch {}
    } else {
      if (!iceCandidateBuffer[deId]) iceCandidateBuffer[deId] = [];
      iceCandidateBuffer[deId].push(candidate);
    }
  });
  socket.on('peer-saiu', ({ peerId }) => removerPeer(peerId));
  socket.on('nova-mensagem', ({ nome, texto, hora, userId }) => adicionarMsg(nome, texto, hora, userId === usuario.id));
  socket.on('mao-levantada', ({ nome }) => {
    document.getElementById('mao-txt').textContent = nome + ' levantou a mão';
    document.getElementById('mao-aviso').style.display = 'block';
    setTimeout(() => document.getElementById('mao-aviso').style.display = 'none', 5000);
  });
  socket.on('convite-reuniao', ({ salaId, salaName, de }) => { mostrarConviteToast(salaId, salaName, de); });
  socket.on('lista-online', (lista) => { usuariosOnline = lista; renderOnline(); atualizarOnlinePill(); });
  socket.on('usuario-online', (u) => { if (!usuariosOnline.find(x => x.id === u.id)) { usuariosOnline.push(u); renderOnline(); atualizarOnlinePill(); } });
  socket.on('usuario-offline', ({ id }) => { usuariosOnline = usuariosOnline.filter(u => u.id !== id); renderOnline(); atualizarOnlinePill(); });
  socket.on('connect', () => {
    socket.emit('registrar-online', { id: usuario.id, nome: usuario.nome, nivel: usuario.nivel, regiao: usuario.regiao_vinculada || usuario.regiao || '' });
    if (salaAtualId) {
      Object.keys(peers).forEach(pid => {
        if (peers[pid]) peers[pid].close();
        if (pid !== 'local') { const t = document.getElementById('thumb-' + pid); if (t) t.remove(); }
      });
      peers = {};
      const lNome = peerNomes['local'], lStream = peerStreams['local'];
      peerNomes = { local: lNome }; peerStreams = { local: lStream };
      peerMicState = {}; iceCandidateBuffer = {};
      if (lStream) renderSpotlight('local');
      socket.emit('entrar-sala', { salaId: salaAtualId, nome: usuario.nome });
      notif('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"/></svg> Reconectado — reconstruindo sala...', 'warn');
    }
  });
  socket.on('connect_error', e => console.warn('Socket:', e.message));
  socket.on('aniversariantes', (lista) => mostrarAniversariantesToast(lista));
}

function atualizarOnlinePill() {
  const outros = usuariosOnline.filter(u => u.id !== usuario.id);
  const n = outros.length;
  document.getElementById('online-pill-count').textContent = n + ' online';
  const chip = document.getElementById('online-count-chip');
  if (chip) chip.textContent = n + ' online';
}

  if (dismissed === new Date().toDateString()) return;
  const hoje = lista.filter(a => parseInt(a.dias_para_aniversario) === 0);
  const breve = lista.filter(a => parseInt(a.dias_para_aniversario) > 0);
  let linhas = [];
  if (hoje.length) linhas.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M21 11.25v8.25a1.5 1.5 0 0 1-1.5 1.5H5.25a1.5 1.5 0 0 1-1.5-1.5v-8.25M12 4.875A2.625 2.625 0 1 0 9.375 7.5H12m0-2.625V7.5m0-2.625A2.625 2.625 0 1 1 14.625 7.5H12m0 0V21m-8.625-9.75h18c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125h-18c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125Z"/></svg> <strong>Hoje:</strong> ' + hoje.map(a => escHtml(a.nome) + (a.cidade ? ' (' + escHtml(a.cidade) + ')' : '')).join(', '));
  if (breve.length) {
    const grupos = {};
    breve.forEach(a => { const d = parseInt(a.dias_para_aniversario); if (!grupos[d]) grupos[d] = []; grupos[d].push(a); });
    Object.keys(grupos).sort((a,b)=>a-b).forEach(d => {
      const label = d == 1 ? 'Amanhã' : 'Em ' + d + ' dias';
      linhas.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"/></svg> <strong>' + label + ':</strong> ' + grupos[d].map(a => escHtml(a.nome)).join(', '));
    });
  }
  const el = document.createElement('div');
  el.className = 'notif-item';
  el.style.cssText = 'max-width:320px;cursor:pointer;border-color:#f59e0b;background:#fffbeb;';
  el.innerHTML = linhas.join('<br>');
  el.onclick = () => { el.remove(); sessionStorage.setItem('bday_reunioes', new Date().toDateString()); };
  document.getElementById('notif').appendChild(el);
  setTimeout(() => { if (el.parentNode) el.remove(); sessionStorage.setItem('bday_reunioes', new Date().toDateString()); }, 12000);
}

function abrirModalCriar() {
  const sel = document.getElementById('input-regiao-sala');
  while (sel.options.length > 1) sel.remove(1);
  regioesDisponiveis.forEach(r => { const op = document.createElement('option'); op.value = r; op.textContent = r; sel.appendChild(op); });
  if (usuario && usuario.regiao_vinculada && regioesDisponiveis.includes(usuario.regiao_vinculada)) sel.value = usuario.regiao_vinculada;
  if (usuario && usuario.nivel === 'lider_regiao' && usuario.regiao_vinculada) aoSelecionarRegiao(usuario.regiao_vinculada);
  document.getElementById('input-nome-sala').value = '';
  document.getElementById('modal-criar').style.display = 'flex';
  setTimeout(() => document.getElementById('input-nome-sala').focus(), 100);
}

async function criarSala() {
  const nome = document.getElementById('input-nome-sala').value.trim();
  if (!nome) { notif('Digite um nome para a sala', 'warn'); return; }
  const regiao = document.getElementById('input-regiao-sala').value;
  try {
    const r = await fetch(API_URL + '/api/salas-video', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + accessToken }, body: JSON.stringify({ nome, regiao: regiao || undefined }) });
    if (!r.ok) { notif('Erro ao criar sala', 'error'); return; }
    const sala = await r.json();
    document.getElementById('input-nome-sala').value = '';
    fecharModal('modal-criar');
    notif('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg> Sala criada!', 'success');
    await carregarSalas();
    await entrarSala(sala.id, sala.nome);
  } catch { notif('Erro ao criar sala', 'error'); }
}

async function encerrarSala(id) {
  if (!confirm('Encerrar esta sala para todos?')) return;
  try {
    await fetch(API_URL + '/api/salas-video/' + id, { method: 'DELETE', headers: { Authorization: 'Bearer ' + accessToken } });
    notif('Sala encerrada', 'success');
    await carregarSalas();
  } catch { notif('Erro ao encerrar', 'error'); }
}

/* ====== AGENDA ====== */
function renderAgenda() {
  const grid = document.getElementById('agenda-grid');
  const agora = new Date();
  const futuras = agenda.filter(a => new Date(a.data) > agora).sort((a, b) => new Date(a.data) - new Date(b.data));
  const passadas = agenda.filter(a => new Date(a.data) <= agora).sort((a, b) => new Date(b.data) - new Date(a.data)).slice(0, 3);
  if (!agenda.length) {
    grid.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"/></svg></div><p>Nenhuma reunião agendada.<br>Clique em "+ Agendar" para adicionar.</p></div>';
    return;
  }
  const card = (a, past) => {
    const d = new Date(a.data); const hoje = d.toDateString() === agora.toDateString();
    return `<div class="agenda-card${hoje ? ' hoje' : ''}">
      <div class="agenda-data">${hoje ? '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg> HOJE — ' : ''}${d.toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: 'short' })} às ${d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</div>
      <div class="agenda-nome">${escHtml(a.nome)}</div>
      <div class="agenda-info">${a.regiao ? '<span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 10.5a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 10.5c0 7.142-7.5 11.25-7.5 11.25S4.5 17.642 4.5 10.5a7.5 7.5 0 1 1 15 0Z"/></svg> ' + escHtml(a.regiao) + '</span>' : ''}${a.desc ? '<span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg> ' + escHtml(a.desc.slice(0, 40)) + '</span>' : ''}${a.participantes?.length ? '<span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg> ' + a.participantes.length + ' convidados</span>' : ''}</div>

  grid.innerHTML = (futuras.length ? futuras.map(a => card(a, false)).join('') : '') +

function abrirModalAgendar() {

function agendarReuniao() {
  const nome = document.getElementById('ag-nome').value.trim();
  const data = document.getElementById('ag-data').value;
  if (!nome || !data) { notif('Preencha nome e data', 'warn'); return; }
  const participantes = [...document.querySelectorAll('#ag-participantes .participante-check:checked')].map(c => c.value);
  agenda.push({ id: Date.now().toString(), nome, data, regiao: document.getElementById('ag-regiao').value, desc: document.getElementById('ag-desc').value.trim(), participantes });
  localStorage.setItem('paralax_agenda', JSON.stringify(agenda));
  renderAgenda(); fecharModal('modal-agendar'); notif('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5m-9-6h.008v.008H12v-.008ZM12 15h.008v.008H12V15Zm0 2.25h.008v.008H12v-.008ZM9.75 15h.008v.008H9.75V15Zm0 2.25h.008v.008H9.75v-.008ZM7.5 15h.008v.008H7.5V15Zm0 2.25h.008v.008H7.5v-.008Zm6.75-4.5h.008v.008h-.008v-.008Zm0 2.25h.008v.008h-.008V15Zm0 2.25h.008v.008h-.008v-.008Zm2.25-4.5h.008v.008H16.5v-.008Zm0 2.25h.008v.008H16.5V15Z"/></svg> Reunião agendada!', 'success');
  ['ag-nome', 'ag-data', 'ag-desc'].forEach(id => document.getElementById(id).value = '');
}

function removerAgenda(id) {
  if (!confirm('Remover esta reunião?')) return;
  agenda = agenda.filter(a => a.id !== id);
  localStorage.setItem('paralax_agenda', JSON.stringify(agenda));
  renderAgenda();
