/**
 * Toca um vídeo de forma robusta para Android Chrome.
 * Android bloqueia autoplay de vídeo não-mutado fora de um gesto de usuário.
 * Se play() falhar com NotAllowedError, exibe o overlay tap-to-play.
 */
function playRobusto(videoEl, { muted = false } = {}) {
  if (!videoEl) return;
  videoEl.muted = muted;
  videoEl.playsInline = true;
  const p = videoEl.play();
  if (p && typeof p.catch === 'function') {
    p.catch(err => {
      if (err.name === 'NotAllowedError') {
        if (!muted) {
          // Autoplay com som bloqueado — tenta mutado e mostra botão de ativar som
          videoEl.muted = true;
          const p2 = videoEl.play();
          if (p2 && typeof p2.catch === 'function') {
            p2.catch(() => {
              // Até mutado falhou — mostra tap-to-play
              if (videoEl.id === 'vc-bg') {
                const overlay = document.getElementById('tap-to-play');
                if (overlay) {
                  overlay.style.display = 'flex';
                  overlay.onclick = () => { overlay.style.display = 'none'; videoEl.muted = false; videoEl.play().catch(() => {}); };
                }
              }
            });
          }
          // Mostra botão de ativar som (gesto do usuário)
          if (videoEl.id === 'vc-bg') {
            const btn = document.getElementById('btn-unmute');
            if (btn) btn.style.display = 'flex';
          }
        } else {
          // Mesmo mutado foi bloqueado — tap-to-play
          if (videoEl.id === 'vc-bg') {
            const overlay = document.getElementById('tap-to-play');
            if (overlay) {
              overlay.style.display = 'flex';
              overlay.onclick = () => { overlay.style.display = 'none'; videoEl.muted = false; videoEl.play().catch(() => {}); };
            }
          }
        }
      }
      // NotSupportedError ou AbortError podem acontecer se srcObject mudou — ignorar
    });
  }
}

/**
 * Seta srcObject e tenta play robusto. Usa evento loadedmetadata como fallback
 * para garantir que o vídeo está pronto antes de tentar reproduzir.
 */
/**
 * Define o stream no elemento de vídeo (sempre muted) e no elemento de áudio separado.
 * - videoEl: sempre muted (sem restrição de autoplay no Android)
 * - #remote-audio: faixas de áudio (elementos <audio> não têm restrição no Android)
 *
 * No Android o ontrack pode disparar antes da faixa de vídeo chegar — o listener
 * onaddtrack garante que o vídeo seja re-iniciado quando a faixa chegar.
 */
function setSrcAndPlay(videoEl, stream, { muted = false } = {}) {
  if (!videoEl) return;

  // Áudio: para o vídeo principal (vc-bg) com streams remotas
  if (videoEl.id === 'vc-bg' && !muted) {
    const audioEl = document.getElementById('remote-audio');
    if (audioEl) {
      const audioStream = new MediaStream(stream.getAudioTracks());
      audioEl.srcObject  = audioStream;
      audioEl.volume     = 1.0;
      audioEl.muted      = false;   // garante que não está muted por acidente
      audioEl.play().catch(() => {});
    }
  }

  function _startVideo() {
    videoEl.srcObject = stream;
    videoEl.muted = true;
    videoEl.playsInline = true;
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('webkit-playsinline', '');

    const doPlay = () => {
      const p = videoEl.play();
      if (p && typeof p.catch === 'function') {
        p.catch(err => {
          if (err.name === 'NotAllowedError' && videoEl.id === 'vc-bg') {
            const overlay = document.getElementById('tap-to-play');
            if (overlay) {
              overlay.style.display = 'flex';
              overlay.onclick = () => { overlay.style.display = 'none'; videoEl.play().catch(() => {}); };
            }
          }
        });
      }
    };

    doPlay();
    videoEl.addEventListener('loadedmetadata', doPlay, { once: true });
    videoEl.addEventListener('pause', () => {
      if (videoEl.srcObject && videoEl.srcObject.active) doPlay();
    });
  }

  // Se o stream ainda não tem faixas de vídeo (Android às vezes dispara ontrack cedo),
  // aguarda a faixa chegar antes de iniciar o vídeo
  if (stream.getVideoTracks().length > 0) {
    _startVideo();
  } else {
    // Inicia com o stream mesmo sem vídeo e re-inicia quando vídeo chegar
    videoEl.srcObject = stream;
    videoEl.muted = true;
    videoEl.play().catch(() => {});

    // SEM { once: true } — se o primeiro addtrack for áudio, não queremos perder o de vídeo
    const _onAddTrack = (e) => {
      if (e.track.kind === 'video') {
        stream.removeEventListener('addtrack', _onAddTrack);
        _startVideo();
      }
    };
    stream.addEventListener('addtrack', _onAddTrack);

    // Fallback escalonado: verifica se vídeo chegou mas videoWidth ainda é 0 (tela preta real)
    const _tryStart = (attempt) => {
      if (stream.getVideoTracks().length > 0) {
        // Tem track de vídeo — garante que esteja renderizando
        if (!videoEl.srcObject || videoEl.videoWidth === 0 || videoEl.paused) {
          stream.removeEventListener('addtrack', _onAddTrack);
          _startVideo();
        }
      } else if (attempt < 6) {
        setTimeout(() => _tryStart(attempt + 1), 800);
      }
    };
    setTimeout(() => _tryStart(1), 800);
  }
}

/* ====== WAKE LOCK ====== */
let _wakeLock = null;

async function solicitarWakeLock() {
  if (!('wakeLock' in navigator)) return;
  try {
    _wakeLock = await navigator.wakeLock.request('screen');
    _wakeLock.addEventListener('release', () => { _wakeLock = null; });
  } catch (e) {
    // Permissão negada ou não suportado — não é crítico
    console.warn('[WakeLock]', e.message);
  }
}

function liberarWakeLock() {
  if (_wakeLock) { _wakeLock.release(); _wakeLock = null; }
}

// Re-adquire wake lock quando usuário volta à aba/app
// e tenta reconectar peers que falharam enquanto página estava em segundo plano
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !salaAtualId) return;
  solicitarWakeLock();
  // Reconecta peers que falharam enquanto tela estava desligada
  for (const [peerId, pc] of Object.entries(peers)) {
    const ice  = pc.iceConnectionState;
    const conn = pc.connectionState;
    if (ice === 'failed' || ice === 'disconnected' || conn === 'failed') {
      tentarReconexao(peerId);
    }
  }
});

async function entrarSala(salaId, salaNome) {
  // ── CRITICAL (Android): torna o container visível ANTES do warm-up.
  // O Android Chrome só registra permissão de autoplay em elementos renderizados.
  // O loading overlay (z-index:8000) fica por cima, então o usuário não vê nada ainda.
  document.getElementById('video-container').classList.add('active');

  document.getElementById('loading').style.display = 'flex';
  document.querySelector('.loading-txt').textContent = 'Acessando câmera e microfone...';

  // ── WARM-UP: ativa os elementos de vídeo sincronamente dentro do gesto do usuário
  // Agora funciona no Android porque vc-bg / pip-vid estão visíveis (rendered).
  ['vc-bg', 'pip-vid'].forEach(id => {
    const v = document.getElementById(id);
    if (v && !v.srcObject) { v.muted = true; v.play().catch(() => {}); }
  });
  // Constraints de áudio otimizadas para cancelar microfonia em Android antigo.
  // Android Chrome < 64 ignora as constraints W3C padrão e precisa dos prefixos goog*.
  // channelCount:1 (mono) melhora muito o AEC — stereo dobra o processamento e piora o eco.
  // sampleRate:16000 é suficiente para voz e reduz carga no AEC do Android.
  const audioC = {
    echoCancellation:        { ideal: true },
    noiseSuppression:        { ideal: true },
    autoGainControl:         { ideal: true },
    channelCount:            { ideal: 1 },   // mono: AEC mais eficaz, menos eco
    sampleRate:              { ideal: 16000 }, // 16kHz suficiente para voz
    latency:                 { ideal: 0 },   // latência mínima ajuda AEC a cancelar eco
    // Constraints legadas: necessárias em Android Chrome antigo (prefixo goog*)
    googEchoCancellation:    true,
    googEchoCancellation2:   true,
    googAutoGainControl:     true,
    googAutoGainControl2:    true,
    googNoiseSuppression:    true,
    googNoiseSuppression2:   true,
    googHighpassFilter:      true,
    googTypingNoiseDetection: true,
  };
  // Começa com resolução conservadora para compatibilidade com Android antigo.
  // Androids antigos travam ou falham a negociação se o primeiro constraint for HD.
  const videoTentativas = [
    { width: { ideal: 640, max: 1280 }, height: { ideal: 480, max: 720 }, frameRate: { ideal: 24, max: 30 }, facingMode: 'user' },
    { width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 15 }, facingMode: 'user' },
    { width: { ideal: 320 }, height: { ideal: 240 }, frameRate: { ideal: 15 }, facingMode: 'user' },
    true
  ];
  let capturou = false;
  for (const vc of videoTentativas) {
    try { localStream = await navigator.mediaDevices.getUserMedia({ video: vc, audio: audioC }); capturou = true; break; }
    catch (e) {}
  }
  if (!capturou) {
    try { localStream = await navigator.mediaDevices.getUserMedia({ video: false, audio: audioC }); notif('Câmera indisponível — só áudio', 'warn'); }
    catch (e2) { notif('Sem acesso à câmera/microfone', 'error'); document.getElementById('loading').style.display = 'none'; return; }
  }

  salaAtual = salaNome; salaAtualId = salaId;
  document.getElementById('sala-nome-h').textContent = salaNome;

  spotlightPeerId = 'local';
  peerStreams['local'] = localStream;
  peerNomes['local'] = usuario.nome + ' (você)';
  renderSpotlight('local');
  adicionarThumb('local', usuario.nome + ' (você)', localStream, true);

  socket.emit('entrar-sala', { salaId, nome: usuario.nome });

  // Wake Lock: evita que o Android suspenda a página durante chamada
  // (sem isso o Chrome throttle JS e ICE pode falhar quando tela apaga)
  solicitarWakeLock();

  // video-container já foi ativado no início da função (antes do warm-up)
  document.getElementById('quality-badge').style.display = 'flex';
  document.getElementById('loading').style.display = 'none';

  // Setup overlay auto-hide + tap to show
  showOverlay();
  initPipDrag();
  const vc = document.getElementById('video-container');
  vc._overlayHandler = (e) => {
    if (!e.target.closest('#local-pip')) showOverlay();
  };
  vc.addEventListener('click', vc._overlayHandler);
  vc.addEventListener('touchstart', vc._overlayHandler, { passive: true });

  iniciarMonitoramentoQualidade();
  renderOnline();
}

// ── PEERCONNECTION ────────────────────────────────────────────────────────────
// Guard: impede reconexões paralelas para o mesmo peer
const _reconectando = new Set();

/**
 * Reordena os codecs no SDP para que `codecName` fique em primeiro lugar.
 * Melhora compatibilidade entre dois Androids antigos: VP8 tem suporte de
 * hardware encoder/decoder em praticamente todos os Androids desde API 18,
 * enquanto VP9 e AV1 podem falhar ou gerar tela preta em devices antigos.
 * Remove também fmtp/rtcp-fb de codecs não preferidos quando desnecessários.
 */
function preferCodecInSdp(sdp, codecName) {
  try {
    const lines = sdp.split('\r\n');
    const mVideoIdx = lines.findIndex(l => l.startsWith('m=video'));
    if (mVideoIdx === -1) return sdp;

    // Coleta todos os payload types que correspondem ao codec desejado
    const preferredPts = [];
    lines.forEach(l => {
      const m = l.match(/^a=rtpmap:(\d+)\s+([^/\s]+)/i);
      if (m && m[2].toLowerCase() === codecName.toLowerCase()) preferredPts.push(m[1]);
    });
    if (!preferredPts.length) return sdp;

    // Reordena a linha m=video colocando os PTs do codec preferido primeiro
    const mParts  = lines[mVideoIdx].split(' ');
    const header  = mParts.slice(0, 3);
    const allPts  = mParts.slice(3);
    const first   = allPts.filter(pt => preferredPts.includes(pt));
    const rest    = allPts.filter(pt => !preferredPts.includes(pt));
    lines[mVideoIdx] = [...header, ...first, ...rest].join(' ');

    return lines.join('\r\n');
  } catch (e) {
    console.warn('[preferCodecInSdp] erro, usando SDP original:', e.message);
    return sdp;
  }
}

// Trata track remoto — Android Chrome pode disparar ontrack com e.streams vazio
function _handleTrack(peerId, e) {
  let stream = e.streams?.[0];
  if (!stream) {
    if (!peerStreams[peerId]) peerStreams[peerId] = new MediaStream();
    peerStreams[peerId].addTrack(e.track);
    stream = peerStreams[peerId];
  } else {
    peerStreams[peerId] = stream;
  }
  peerStreams[peerId] = stream;
  adicionarThumb(peerId, peerNomes[peerId] || peerId, stream, false);
  atualizarContagem();
  if (spotlightPeerId === peerId) {
    const vid = document.getElementById('vc-bg');
    if (vid) setSrcAndPlay(vid, stream, { muted: false });
  } else if (spotlightPeerId === 'local' && Object.keys(peerStreams).filter(k => k !== 'local').length === 1) {
    renderSpotlight(peerId);
  }
}

async function criarPC(peerId, ofertante) {
  // Fecha conexão anterior se existir
  if (peers[peerId]) {
    try { peers[peerId].close(); } catch {}
    delete peers[peerId];
  }

  peerRoles[peerId] = ofertante;

  const iceServers = await getIceServers();
  const pc = new RTCPeerConnection({
    iceServers,
    iceCandidatePoolSize: 2,      // pré-coleta candidatos para conexão mais rápida
    bundlePolicy:   'max-bundle', // minimiza portas: ajuda NAT/firewall em redes mobile
    rtcpMuxPolicy:  'require',    // áudio+vídeo+RTCP na mesma porta; obrigatório para max-bundle
  });
  peers[peerId] = pc;

  // Adiciona tracks locais
  if (localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));

  pc.ontrack = e => _handleTrack(peerId, e);

  pc.onicecandidate = ({ candidate }) => {
    if (candidate) socket.emit('ice-candidate', { paraId: peerId, candidate });
  };

  pc.oniceconnectionstatechange = () =>
    console.log(`[ICE ${peerId.slice(0,8)}] ${pc.iceConnectionState}`);

  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    console.log(`[CONN ${peerId.slice(0,8)}] ${s}`);
    if (s === 'connected') {
      if (qualidadeAtual !== 'good') aplicarQualidade(qualidadeAtual);
    } else if (s === 'failed') {
      notif('Falha de conexão com ' + (peerNomes[peerId] || 'participante'), 'warn');
      tentarReconexao(peerId);
    } else if (s === 'closed') {
      removerPeer(peerId);
    }
  };

  if (ofertante) {
    // offerToReceiveAudio/Video: necessário em versões antigas do WebRTC Android
    const offer = await pc.createOffer({ offerToReceiveAudio: true, offerToReceiveVideo: true });
    // Prefere VP8: suporte de hardware encoder/decoder em todos os Androids desde API 18.
    // VP9/AV1 podem causar tela preta ou falha silenciosa em devices antigos.
    const sdpMod = preferCodecInSdp(offer.sdp, 'VP8');
    await pc.setLocalDescription({ type: 'offer', sdp: sdpMod });
    socket.emit('offer', { paraId: peerId, offer: pc.localDescription });
  }

  return pc;
}

async function tentarReconexao(peerId) {
  if (_reconectando.has(peerId)) return;
  _reconectando.add(peerId);
  try {
    await new Promise(r => setTimeout(r, 2500));
    if (!localStream || !socket?.connected) return;
    const pc = peers[peerId];
    if (!pc || pc.connectionState === 'connected') return;

    const ofertante = peerRoles[peerId] ?? true;
    console.log('[Reconexão]', peerId.slice(0,8), 'ofertante=', ofertante);

    if (ofertante) {
      // Cria PC novo e envia offer fresco — mais confiável que ICE restart no Android
      await criarPC(peerId, true);
    } else {
      // Respondedor: fecha PC e aguarda o ofertante enviar novo offer
      try { peers[peerId].close(); } catch {}
      delete peers[peerId];
    }
  } catch (e) {
    console.warn('[Reconexão]', e);
    removerPeer(peerId);
  } finally {
    setTimeout(() => _reconectando.delete(peerId), 8000);
  }
}

async function flushIceCandidates(peerId) {
  const pc = peers[peerId];
  if (!pc || !iceCandidateBuffer[peerId]) return;
  for (const c of iceCandidateBuffer[peerId]) { try { await pc.addIceCandidate(new RTCIceCandidate(c)); } catch (e) {} }
  delete iceCandidateBuffer[peerId];
}

function removerPeer(peerId) {
  if (peers[peerId]) { peers[peerId].close(); delete peers[peerId]; }
  delete peerNomes[peerId]; delete peerStreams[peerId]; delete peerMicState[peerId]; delete iceCandidateBuffer[peerId];
  if (peerId !== 'local') {
    const t = document.getElementById('thumb-' + peerId); if (t) t.remove();
  }
  if (spotlightPeerId === peerId) renderSpotlight('local');
  atualizarContagem();
}

/* ====== SPOTLIGHT E THUMBNAILS ====== */
function renderSpotlight(peerId) {
  spotlightPeerId = peerId;
  const stream = peerStreams[peerId];
  const nome = peerNomes[peerId] || peerId;
  const vid = document.getElementById('vc-bg');
  const avatarEl = document.getElementById('vc-bg-avatar');
  const avatarLetter = document.getElementById('vc-bg-avatar-letter');
  const avatarName = document.getElementById('vc-bg-avatar-name');
  if (stream) {
    const isLocal = peerId === 'local';
    setSrcAndPlay(vid, stream, { muted: isLocal });
    // Mostra avatar por padrão e remove quando vídeo confirmar frame real (videoWidth > 0)
    // Isso evita tela preta enquanto vídeo ainda está carregando
    avatarEl.style.display = 'flex';
    avatarLetter.textContent = (nome || '?')[0].toUpperCase();
    if (avatarName) avatarName.textContent = nome;
    // Verifica em intervalos curtos se o vídeo realmente está renderizando
    const _checkVideo = (tries) => {
      if (spotlightPeerId !== peerId) return; // spotlight mudou, para
      const hasRealVideo = vid.videoWidth > 0 && vid.videoHeight > 0;
      if (hasRealVideo) {
        avatarEl.style.display = 'none';
      } else if (tries < 20) {
        setTimeout(() => _checkVideo(tries + 1), 500);
      }
      // Se após 10s ainda não tem vídeo, mantém o avatar (conexão falhou / sem câmera)
    };
    setTimeout(() => _checkVideo(0), 300);
  }
  document.querySelectorAll('.thumb-tile').forEach(t => t.classList.remove('spotlight-active'));
  const thumbAtivo = document.getElementById('thumb-' + peerId);
  if (thumbAtivo) thumbAtivo.classList.add('spotlight-active');
}

function adicionarThumb(id, nome, stream, isLocal) {
  if (isLocal) {
    // Local goes to the PiP bubble
    const pipVid = document.getElementById('pip-vid');
    if (pipVid) setSrcAndPlay(pipVid, stream, { muted: true });
    const hasVideo = stream.getVideoTracks().some(t => t.enabled && t.readyState === 'live');
    const pipAv = document.getElementById('pip-avatar');
    if (pipAv) pipAv.style.display = hasVideo ? 'none' : 'flex';
    const pipLetter = document.getElementById('pip-letter');
    if (pipLetter) pipLetter.textContent = (nome || '?')[0].toUpperCase();
    return;
  }
  // Remote peers go to the thumb strip
  const strip = document.getElementById('thumb-strip');
  let tile = document.getElementById('thumb-' + id);
  if (!tile) {
    tile = document.createElement('div');
    tile.className = 'thumb-tile';
    tile.id = 'thumb-' + id;
    tile.onclick = () => { renderSpotlight(id); showOverlay(); };
    tile.innerHTML = `
      <video id="thumbvid-${id}" autoplay playsinline webkit-playsinline muted style="width:100%;height:100%;object-fit:cover"></video>
      <div class="thumb-avatar" id="thumbav-${id}"><div class="thumb-avatar-circle">${(nome || '?')[0].toUpperCase()}</div></div>
      <div class="thumb-label">${escHtml(nome)}</div>`;
    strip.appendChild(tile);
  }
  const v = document.getElementById('thumbvid-' + id);
  setSrcAndPlay(v, stream, { muted: true });
  const hasVideo = stream.getVideoTracks().some(t => t.enabled && t.readyState === 'live');
  document.getElementById('thumbav-' + id).style.display = hasVideo ? 'none' : 'flex';
  atualizarContagem();
}

function atualizarContagem() {
  // count remote peers (thumb tiles) + local = total
  const n = document.querySelectorAll('.thumb-tile').length + 1;
  const el = document.getElementById('sala-meta-h');
  if (el) el.textContent = n + ' participante' + (n !== 1 ? 's' : '');
}

/* ====== TOGGLE LAYOUT ====== */
function toggleLayout() {
  const strip = document.getElementById('thumb-strip');
  const btn = document.getElementById('btn-layout');
  if (layoutMode === 'spotlight') {
    layoutMode = 'grid'; strip.classList.add('grid-mode'); btn.title = 'Modo spotlight'; btn.textContent = '⊡';
  } else {
    layoutMode = 'spotlight'; strip.classList.remove('grid-mode'); btn.title = 'Modo grade'; btn.textContent = '⊞';
    renderSpotlight(spotlightPeerId);
  }
}

/* ====== HELPER ====== */
function setCtrl(id, {circleClass, icon, label}) {
  const c = document.getElementById(id + '-circle');
  if (c) { c.className = circleClass || 'ctrl-circle'; if (icon) c.querySelector('.material-icons-round').textContent = icon; }

}

function toggleCam() {
  camAtivo = !camAtivo;

async function toggleTela() {
  if (!telaAtivo) {
    try {
      screenStream = await navigator.mediaDevices.getDisplayMedia({ video: { cursor: 'always' }, audio: false });
      const track = screenStream.getVideoTracks()[0];
      Object.values(peers).forEach(pc => { const s = pc.getSenders().find(s => s.track?.kind === 'video'); if (s) s.replaceTrack(track); });
      const compositeStream = new MediaStream([track, ...localStream.getAudioTracks()]);
      const thumbVid = document.getElementById('pip-vid');
      if (thumbVid) thumbVid.srcObject = compositeStream;
      if (spotlightPeerId === 'local') document.getElementById('vc-bg').srcObject = compositeStream;
      track.onended = () => { if (telaAtivo) toggleTela(); };
      telaAtivo = true;
      setCtrl('btn-tela', { circleClass: 'ctrl-circle active', icon: 'stop_screen_share', label: 'Parar tela' });
    } catch (e) { notif('Compartilhamento cancelado', 'warn'); }
  } else {
    const cam = localStream.getVideoTracks()[0];
    Object.values(peers).forEach(pc => { const s = pc.getSenders().find(s => s.track?.kind === 'video'); if (s && cam) s.replaceTrack(cam); });
    const thumbVid = document.getElementById('pip-vid');
    if (thumbVid) thumbVid.srcObject = localStream;
    if (spotlightPeerId === 'local') document.getElementById('vc-bg').srcObject = localStream;
    if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
    telaAtivo = false;
    setCtrl('btn-tela', { circleClass: 'ctrl-circle', icon: 'present_to_all', label: 'Tela' });
  }
}

function toggleMao() {
  maoLevantada = !maoLevantada;
  socket.emit(maoLevantada ? 'levantar-mao' : 'abaixar-mao', salaAtualId);
  setCtrl('btn-mao', { circleClass: maoLevantada ? 'ctrl-circle active' : 'ctrl-circle', icon: 'back_hand', label: maoLevantada ? 'Abaixar' : 'Mão' });
}

function toggleChat() {
  chatAberto = !chatAberto;
  document.getElementById('chat-panel').classList.toggle('open', chatAberto);
  const c = document.getElementById('btn-chat-circle');
  if (c) c.className = chatAberto ? 'ctrl-circle active' : 'ctrl-circle';
  if (chatAberto) document.getElementById('chat-unread').style.display = 'none';
}

function toggleGravacao() {
  if (!gravando) {
    try {
      const ctx = new AudioContext(), dest = ctx.createMediaStreamDestination();
      ctx.createMediaStreamSource(localStream).connect(dest);
      const vt = (telaAtivo && screenStream ? screenStream : localStream).getVideoTracks()[0];
      const rs = new MediaStream([...(vt ? [vt] : []), ...dest.stream.getTracks()]);
      recChunks = [];
      mediaRec = new MediaRecorder(rs, { mimeType: 'video/webm;codecs=vp9,opus' });
      mediaRec.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
      mediaRec.onstop = () => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(new Blob(recChunks, { type: 'video/webm' }));
        a.download = 'reuniao-' + new Date().toISOString().slice(0, 19).replace(/:/g, '-') + '.webm';
        a.click();
      };
      mediaRec.start(1000); gravando = true;
      setCtrl('btn-rec', { circleClass: 'ctrl-circle rec', icon: 'radio_button_checked', label: 'Gravando' });
      notif('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M5.25 7.5A2.25 2.25 0 0 1 7.5 5.25h9a2.25 2.25 0 0 1 2.25 2.25v9a2.25 2.25 0 0 1-2.25 2.25h-9a2.25 2.25 0 0 1-2.25-2.25v-9Z"/></svg> Gravação iniciada');
    } catch (e) { notif('Erro ao gravar: ' + e.message, 'error'); }
  } else {
    mediaRec.stop(); gravando = false;
    setCtrl('btn-rec', { circleClass: 'ctrl-circle', icon: 'radio_button_checked', label: 'Gravar' });
    notif('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="18" height="18" class="hi" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg> Gravação salva', 'success');
  }
}

/* ====== CHAT ====== */

/* ====== SAIR ====== */
async function sairDaSala() {
  pararMonitoramentoQualidade();
  liberarWakeLock();
  if (gravando) { mediaRec.stop(); gravando = false; }
  Object.values(peers).forEach(pc => pc.close()); peers = {}; peerNomes = {}; peerStreams = {}; peerMicState = {}; peerRoles = {};
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  if (screenStream) { screenStream.getTracks().forEach(t => t.stop()); screenStream = null; }
  if (socket && salaAtualId) socket.emit('sair-sala', salaAtualId);
  // Cleanup overlay events
  const vc = document.getElementById('video-container');
  if (vc._overlayHandler) {
    vc.removeEventListener('click', vc._overlayHandler);
    vc.removeEventListener('touchstart', vc._overlayHandler);
    delete vc._overlayHandler;
  }
  clearTimeout(overlayTimer); overlayTimer = null;
  document.getElementById('call-overlay').classList.remove('show');
  // Cleanup PiP
  const pipVid = document.getElementById('pip-vid');
  if (pipVid) { pipVid.srcObject = null; }
  const pipAv = document.getElementById('pip-avatar');
  if (pipAv) pipAv.style.display = 'none';
  // Reset PiP position
  const pip = document.getElementById('local-pip');
  if (pip) { pip.style.left=''; pip.style.top=''; pip.style.right='14px'; pip.style.bottom='130px'; }
  // Cleanup background video
  const vcBg = document.getElementById('vc-bg');
  if (vcBg) vcBg.srcObject = null;
  const tapOverlay = document.getElementById('tap-to-play');
  if (tapOverlay) tapOverlay.style.display = 'none';
  const remoteAudio = document.getElementById('remote-audio');
  if (remoteAudio) { remoteAudio.srcObject = null; }
  const vcBgAv = document.getElementById('vc-bg-avatar');
  if (vcBgAv) vcBgAv.style.display = 'none';
  document.getElementById('thumb-strip').innerHTML = '';
  document.getElementById('chat-msgs').innerHTML = '';
  document.getElementById('chat-panel').classList.remove('open');
  document.getElementById('quality-badge').style.display = 'none';
  document.getElementById('thumb-strip').classList.remove('grid-mode');
  chatAberto = false; maoLevantada = false; telaAtivo = false; micAtivo = true; camAtivo = true; gravando = false;
  layoutMode = 'spotlight'; spotlightPeerId = 'local';
  qualidadeAtual = 'good'; nivelPendente = null; ciclosQualidade = 0;
  setCtrl('btn-mic',  { circleClass: 'ctrl-circle', icon: 'mic',                  label: 'Mic'    });
  setCtrl('btn-cam',  { circleClass: 'ctrl-circle', icon: 'videocam',             label: 'Câmera' });
  setCtrl('btn-tela', { circleClass: 'ctrl-circle', icon: 'present_to_all',       label: 'Tela'   });
  setCtrl('btn-mao',  { circleClass: 'ctrl-circle', icon: 'back_hand',            label: 'Mão'    });
  setCtrl('btn-chat', { circleClass: 'ctrl-circle', icon: 'chat_bubble'                           });
  setCtrl('btn-rec',  { circleClass: 'ctrl-circle', icon: 'radio_button_checked', label: 'Gravar' });
  salaAtual = null; salaAtualId = null;
  // Fecha o overlay de vídeo, volta ao dashboard
  document.getElementById('video-container').classList.remove('active');
  renderOnline();
  await carregarSalas();
}

/* ====== QUALIDADE DE CONEXÃO ADAPTATIVA ====== */
function iniciarMonitoramentoQualidade() {
  qualidadeAtual = 'good'; nivelPendente = null; ciclosQualidade = 0;
  document.getElementById('quality-badge').style.display = 'flex';
  qualityInterval = setInterval(async () => {
    if (!Object.keys(peers).length) { decidirQualidade('good'); return; }
    try {
      let pior = 'good';
      for (const pc of Object.values(peers)) {
        const stats = await pc.getStats();
        let rtt = null, loss = 0, jitter = 0;
        stats.forEach(s => {
          if (s.type === 'remote-inbound-rtp' && s.kind === 'video') {
            rtt    = s.roundTripTime ?? rtt;
            loss   = s.fractionLost  ?? 0;
            jitter = s.jitter        ?? 0;
          }
        });
        if (rtt === null) continue;
        let n = 'good';
        if      (rtt > 0.40 || loss > 0.10 || jitter > 0.06) n = 'bad';
        else if (rtt > 0.20 || loss > 0.03 || jitter > 0.03) n = 'medium';
        if (n === 'bad') { pior = 'bad'; break; }
        if (n === 'medium' && pior !== 'bad') pior = 'medium';
      }
      decidirQualidade(pior);
    } catch {}
  }, 3000);
}

function decidirQualidade(nivel) {
  if (nivel === qualidadeAtual) { nivelPendente = null; ciclosQualidade = 0; return; }
  const ehDowngrade = (qualidadeAtual === 'good' && nivel !== 'good') || (qualidadeAtual === 'medium' && nivel === 'bad');
  if (nivel !== nivelPendente) { nivelPendente = nivel; ciclosQualidade = 0; }
  ciclosQualidade++;
  if (ehDowngrade || ciclosQualidade >= 4) {
    qualidadeAtual = nivel; setQuality(nivel); aplicarQualidade(nivel);
    nivelPendente = null; ciclosQualidade = 0;
  }
}

async function aplicarQualidade(q) {
  const cfgs = {
    good:   { maxBitrate: 2_500_000, scaleResolutionDownBy: 1,   maxFramerate: 30, camWidth: 1920, camHeight: 1080 },
    medium: { maxBitrate:   500_000, scaleResolutionDownBy: 1.5, maxFramerate: 20, camWidth: 1280, camHeight: 720  },
    bad:    { maxBitrate:   120_000, scaleResolutionDownBy: 3,   maxFramerate: 10, camWidth: 640,  camHeight: 360  },
  };
  const cfg = cfgs[q];
  if (localStream && !telaAtivo) {
    const vt = localStream.getVideoTracks()[0];
    if (vt) {
      try { await vt.applyConstraints({ width: { ideal: cfg.camWidth }, height: { ideal: cfg.camHeight }, frameRate: { ideal: cfg.maxFramerate } }); } catch {}
    }
  }
  for (const pc of Object.values(peers)) {
    const sender = pc.getSenders().find(s => s.track?.kind === 'video');
    if (!sender) continue;
    try {
      const params = sender.getParameters();
      if (!params.encodings?.length) params.encodings = [{}];
      params.encodings.forEach(enc => {
        enc.maxBitrate            = cfg.maxBitrate;
        enc.scaleResolutionDownBy = cfg.scaleResolutionDownBy;
        enc.maxFramerate          = cfg.maxFramerate;
        enc.priority              = q === 'good' ? 'high' : 'low';
        enc.networkPriority       = q === 'good' ? 'high' : 'low';
      });
      await sender.setParameters(params);
    } catch (e) { console.warn('aplicarQualidade:', e); }
  }
}

function pararMonitoramentoQualidade() { if (qualityInterval) { clearInterval(qualityInterval); qualityInterval = null; } }

function setQuality(q) {
  const b = document.getElementById('quality-badge');
  const txt = document.getElementById('quality-txt');
  b.className = 'quality-badge quality-' + q;
  txt.textContent = { good: 'Boa', medium: 'Média', bad: 'Ruim' }[q];
  const bars = [document.getElementById('qb1'), document.getElementById('qb2'), document.getElementById('qb3')];
  if (q === 'good')        bars.forEach(b => { if (b) b.style.opacity = '1'; });
  else if (q === 'medium') { if (bars[0]) bars[0].style.opacity = '1'; if (bars[1]) bars[1].style.opacity = '1'; if (bars[2]) bars[2].style.opacity = '.3'; }
  else                     { if (bars[0]) bars[0].style.opacity = '1'; if (bars[1]) bars[1].style.opacity = '.3'; if (bars[2]) bars[2].style.opacity = '.3'; }
}

/* ====== UTILITÁRIOS ====== */
function fecharModal(id) { document.getElementById(id).style.display = 'none'; }
function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function notif(msg, tipo) {
  const el = document.createElement('div');
  el.className = 'notif-item ' + (tipo || '');
  el.innerHTML = msg; // innerHTML para renderizar ícones SVG inline
  document.getElementById('notif').appendChild(el);
  setTimeout(() => el.remove(), 4500);
}
