<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candidatos do Sistema</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Sora', sans-serif; background: #f1f5f9; color: #0f172a; min-height: 100vh; }

    .page-header {
      background: linear-gradient(135deg, #0d2d6b, #1565c0);
      color: white; padding: 20px 28px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      box-shadow: 0 4px 20px rgba(13,45,107,.35);
    }
    .page-header h1 { font-size: 20px; font-weight: 800; }
    .page-header p  { font-size: 12px; opacity: .75; margin-top: 2px; }
    .btn-back {
      padding: 8px 16px; border: 1.5px solid rgba(255,255,255,.4);
      border-radius: 9px; background: transparent; color: white;
      font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit;
      text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn-back:hover { background: rgba(255,255,255,.1); }

    .wrap { max-width: 760px; margin: 32px auto; padding: 0 16px 60px; display: flex; flex-direction: column; gap: 20px; }

    .card {
      background: white; border-radius: 18px; padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,.07); border: 1px solid #e2e8f0;
    }
    .card-title { font-size: 15px; font-weight: 700; color: #0f172a; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }

    .cand-list { display: flex; flex-direction: column; gap: 10px; margin-bottom: 4px; }
    .cand-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      border-radius: 12px; background: #f8fafc; border: 1.5px solid #e2e8f0;
    }
    .cand-avatar {
      width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
      border: 2px solid #e2e8f0; flex-shrink: 0;
    }
    .cand-avatar-ph {
      width: 46px; height: 46px; border-radius: 50%; background: #e2e8f0;
      display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0;
    }
    .cand-info { flex: 1; min-width: 0; }
    .cand-nome { font-weight: 700; font-size: 14px; }
    .cand-meta { font-size: 11px; color: #64748b; margin-top: 2px; }
    .badge-mini {
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
    }
    .btn-icon {
      padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      cursor: pointer; font-family: inherit; transition: .15s;
    }
    .btn-edit  { border: 1.5px solid #cbd5e1; background: #fff; color: #1e293b; }
    .btn-edit:hover { background: #f1f5f9; }
    .btn-del   { border: 1.5px solid #fca5a5; background: #fff; color: #b91c1c; }
    .btn-del:hover { background: #fee2e2; }
    .empty-state { text-align: center; color: #94a3b8; font-size: 13px; padding: 24px 0; }

    .section-divider {
      font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
      color: #94a3b8; margin: 20px 0 14px; padding-bottom: 8px; border-bottom: 1px solid #e2e8f0;
    }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 140px; }
    .form-group label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #64748b; }
    .form-group input[type=text],
    .form-group input[type=number] {
      padding: 10px 12px; border-radius: 10px; border: 1.5px solid #e2e8f0;
      font-size: 14px; font-family: inherit; outline: none; background: #f8fafc; color: #0f172a;
      transition: .2s;
    }
    .form-group input:focus { border-color: #1565c0; box-shadow: 0 0 0 3px rgba(21,101,192,.12); background: white; }
    .form-group input[type=color] { height: 40px; padding: 3px 6px; cursor: pointer; }
    .form-group input[type=file]  { font-size: 12px; padding: 8px; }

    .foto-preview { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; display: none; }
    .checkbox-row { display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .checkbox-row input { width: 15px; height: 15px; }

    .alert { padding: 10px 14px; border-radius: 9px; font-size: 12px; font-weight: 600; display: none; margin-bottom: 8px; }
    .alert-error   { background: #fee2e2; color: #b91c1c; }
    .alert-success { background: #dcfce7; color: #15803d; }

    .btn-primary {
      width: 100%; padding: 13px; border: none; border-radius: 11px;
      background: linear-gradient(135deg, #0d2d6b, #1565c0); color: white;
      font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
      box-shadow: 0 4px 14px rgba(21,101,192,.35); transition: .2s;
    }
    .btn-primary:hover { opacity: .9; transform: translateY(-1px); }
    .btn-primary:disabled { opacity: .6; transform: none; cursor: not-allowed; }

    /* LOGIN */
    #login-overlay {
      position: fixed; inset: 0; background: rgba(8,18,48,.8); backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center; z-index: 9000;
    }
    #login-overlay.hidden { display: none; }
    .login-box {
      width: 340px; max-width: calc(100vw - 32px); background: white; border-radius: 22px;
      padding: 36px 32px; box-shadow: 0 30px 70px rgba(0,0,0,.35); display: flex; flex-direction: column; gap: 14px;
    }
    .login-box h2 { text-align: center; font-size: 18px; font-weight: 800; color: #0f172a; }
    .login-box input {
      width: 100%; padding: 11px 13px; border-radius: 10px; border: 1.5px solid #e2e8f0;
      font-size: 14px; font-family: inherit; outline: none; background: #f8fafc; color: #0f172a;
    }
    .login-box input:focus { border-color: #1565c0; background: white; }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-box">
    <div style="text-align:center;">
      <div style="width:50px;height:50px;background:linear-gradient(135deg,#0d2d6b,#1565c0);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;">🎯</div>
      <h2>Candidatos do Sistema</h2>
      <p style="font-size:12px;color:#64748b;margin-top:4px;">Acesso restrito a administradores</p>
    </div>
    <input id="login-user" type="text" placeholder="Usuário" autocomplete="username">
    <input id="login-pass" type="password" placeholder="Senha" autocomplete="current-password">
    <div id="login-err" class="alert alert-error"></div>
    <button class="btn-primary" id="login-btn" onclick="login()">Entrar</button>
  </div>
</div>

<!-- APP -->
<div id="app" style="display:none;">
  <div class="page-header">
    <div>
      <h1>🎯 Candidatos do Sistema</h1>
      <p>Configure os candidatos exibidos no mapa e nos relatórios deste tenant</p>
    </div>
    <a href="./home.html" class="btn-back">← Voltar</a>
  </div>

  <div class="wrap">
    <!-- Lista atual -->
    <div class="card">
      <div class="card-title">
        🏅 Candidatos cadastrados
        <button onclick="carregarCandidatos()" style="margin-left:auto;padding:5px 12px;border:1.5px solid #e2e8f0;border-radius:8px;background:#f8fafc;font-size:11px;font-weight:700;cursor:pointer;">↺ Atualizar</button>
      </div>
      <div id="cand-list" class="cand-list">
        <div class="empty-state">Carregando...</div>
      </div>
    </div>

    <!-- Formulário -->
    <div class="card">
      <div class="card-title">✏️ Adicionar / Editar candidato</div>

      <div class="form-row">
        <div class="form-group">
          <label>Chave interna <span style="color:#f59e0b;">⚠ não mude após gravar dados</span></label>
          <input type="text" id="c-chave" placeholder="ex: betao_2026">
        </div>
        <div class="form-group">
          <label>Nome de exibição</label>
          <input type="text" id="c-nome" placeholder="ex: Betão da Silva">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group" style="flex:0.4;">
          <label>Cor fundo do badge</label>
          <input type="color" id="c-cor-fundo" value="#e0e7ff">
        </div>
        <div class="form-group" style="flex:0.4;">
          <label>Cor texto do badge</label>
          <input type="color" id="c-cor-texto" value="#3730a3">
        </div>
        <div class="form-group" style="flex:0.4;">
          <label title="Cor usada para pintar as cidades no mapa conforme a meta">🗺️ Cor do mapa</label>
          <input type="color" id="c-cor-mapa" value="#cb181d">
        </div>
        <div class="form-group" style="flex:0.3;">
          <label>Ordem</label>
          <input type="number" id="c-ordem" value="0" min="0">
        </div>
        <div class="form-group" style="justify-content:flex-end;display:flex;align-items:flex-end;">
          <label class="checkbox-row">
            <input type="checkbox" id="c-votos2022">
            Tinha votos em 2022
          </label>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Cargo / Eleição</label>
          <input type="text" id="c-cargo" placeholder="ex: Deputado Federal, Vereador...">
        </div>
        <div class="form-group">
          <label>Meta de votos</label>
          <input type="number" id="c-meta-votos" placeholder="ex: 50000" min="0">
        </div>
      </div>

      <div class="form-row" style="align-items:flex-end;">
        <div class="form-group">
          <label>Foto do candidato</label>
          <input type="file" id="c-foto" accept="image/jpeg,image/png,image/webp">
        </div>
        <div class="form-group" style="flex:0;align-items:center;justify-content:center;">
          <img id="c-foto-preview" class="foto-preview" alt="preview">
        </div>
      </div>

      <div id="c-alert-error"   class="alert alert-error"></div>
      <div id="c-alert-success" class="alert alert-success"></div>

      <button class="btn-primary" id="c-salvar-btn" onclick="salvarCandidato()">
        💾 Salvar candidato
      </button>
    </div>
  </div>
</div>

<script src="tenant.js"></script>
<script>
const API = 'https://map-backend-j88s.onrender.com';
const getToken = () => localStorage.getItem('token');

async function apiFetch(path, opts = {}) {
  const token = getToken();
  const res = await fetch(API + '/api' + path, {
    ...opts,
    headers: { ...(token ? { Authorization: 'Bearer ' + token } : {}), ...(opts.headers || {}) }
  });
  if (res.status === 401 || res.status === 403) { logout(); throw new Error('Sem acesso'); }
  return res;
}

function logout() { localStorage.clear(); location.reload(); }

/* ── LOGIN ── */
async function login() {
  const btn = document.getElementById('login-btn');
  const err = document.getElementById('login-err');
  err.style.display = 'none';
  btn.textContent = 'Entrando...'; btn.disabled = true;
  try {
    const res = await fetch(API + '/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ usuario: document.getElementById('login-user').value.trim(), senha: document.getElementById('login-pass').value.trim() })
    });
    if (!res.ok) throw new Error();
    const d = await res.json();
    if (d.user?.nivel !== 'dono') throw new Error('acesso_negado');
    localStorage.setItem('token', d.accessToken);
    localStorage.setItem('user', JSON.stringify(d.user));
    iniciarApp();
  } catch(e) {
    err.textContent = e.message === 'acesso_negado' ? 'Acesso restrito ao dono do sistema' : 'Usuário ou senha inválidos';
    err.style.display = 'block';
  } finally { btn.textContent = 'Entrar'; btn.disabled = false; }
}

function iniciarApp() {
  document.getElementById('login-overlay').classList.add('hidden');
  document.getElementById('app').style.display = 'block';
  carregarCandidatos();
}

/* ── CANDIDATOS ── */
async function carregarCandidatos() {
  const lista = document.getElementById('cand-list');
  lista.innerHTML = '<div class="empty-state">Carregando...</div>';
  try {
    const res = await apiFetch('/admin/config/candidatos');
    if (!res.ok) throw new Error('Erro ' + res.status);
    const cands = await res.json();
    if (!cands.length) {
      lista.innerHTML = '<div class="empty-state">Nenhum candidato cadastrado.<br>Use o formulário abaixo para adicionar.</div>';
      return;
    }
    lista.innerHTML = cands.map(c => `
      <div class="cand-row">
        ${c.foto_url
          ? `<img src="${c.foto_url}" class="cand-avatar">`
          : `<div class="cand-avatar-ph">👤</div>`}
        <div class="cand-info">
          <div class="cand-nome">${c.nome}</div>
          <div class="cand-meta">chave: <code>${c.chave}</code> · ordem ${c.ordem ?? 0}${c.tem_votos_2022 ? ' · votos 2022 ✅' : ''}</div>
        </div>
        <span class="badge-mini" style="background:${c.cor_fundo};color:${c.cor_texto};">${c.nome}</span>
        <button class="btn-icon btn-edit" onclick='editarCandidato(${JSON.stringify(c)})'>✏️</button>
        <button class="btn-icon btn-del"  onclick="excluirCandidato('${c.chave}','${c.nome.replace(/'/g,'')}')">🗑️</button>
      </div>`).join('');
  } catch(e) {
    lista.innerHTML = `<div class="empty-state" style="color:#b91c1c;">Erro: ${e.message}</div>`;
  }
}

function editarCandidato(c) {
  document.getElementById('c-chave').value  = c.chave;
  document.getElementById('c-nome').value   = c.nome;
  document.getElementById('c-cor-fundo').value = c.cor_fundo || '#e0e7ff';
  document.getElementById('c-cor-texto').value = c.cor_texto || '#3730a3';
  document.getElementById('c-cor-mapa').value  = c.cor_mapa  || c.cor_texto || '#cb181d';
  document.getElementById('c-ordem').value  = c.ordem ?? 0;
  document.getElementById('c-votos2022').checked = !!c.tem_votos_2022;
  document.getElementById('c-cargo').value  = c.cargo || '';
  document.getElementById('c-meta-votos').value = c.meta_votos || '';
  const prev = document.getElementById('c-foto-preview');
  if (c.foto_url) { prev.src = c.foto_url; prev.style.display = 'block'; }
  else prev.style.display = 'none';
  document.getElementById('c-salvar-btn').textContent = '💾 Atualizar candidato';
  document.getElementById('c-chave').focus();
  window.scrollTo({ top: document.getElementById('c-chave').getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' });
}

async function excluirCandidato(chave, nome) {
  if (!confirm(`Excluir "${nome}" (${chave})?\nIsso não remove dados históricos de lideranças ou metas.`)) return;
  try {
    const res = await apiFetch('/admin/config/candidatos/' + encodeURIComponent(chave), { method: 'DELETE' });
    if (!res.ok) throw new Error('Erro ' + res.status);
    carregarCandidatos();
  } catch(e) { alert('Erro ao excluir: ' + e.message); }
}

async function salvarCandidato() {
  const errEl = document.getElementById('c-alert-error');
  const okEl  = document.getElementById('c-alert-success');
  errEl.style.display = 'none'; okEl.style.display = 'none';

  const chave = document.getElementById('c-chave').value.trim();
  const nome  = document.getElementById('c-nome').value.trim();
  if (!chave) { errEl.textContent = 'Chave interna obrigatória'; errEl.style.display = 'block'; return; }
  if (!nome)  { errEl.textContent = 'Nome de exibição obrigatório'; errEl.style.display = 'block'; return; }

  const btn = document.getElementById('c-salvar-btn');
  btn.textContent = 'Salvando...'; btn.disabled = true;

  try {
    const fd = new FormData();
    fd.append('chave',         chave);
    fd.append('nome',          nome);
    fd.append('cor_fundo',     document.getElementById('c-cor-fundo').value);
    fd.append('cor_texto',     document.getElementById('c-cor-texto').value);
    fd.append('cor_mapa',      document.getElementById('c-cor-mapa').value);
    fd.append('ordem',         document.getElementById('c-ordem').value);
    fd.append('tem_votos_2022', document.getElementById('c-votos2022').checked);
    fd.append('cargo',         document.getElementById('c-cargo').value.trim());
    const metaVotos = document.getElementById('c-meta-votos').value;
    if (metaVotos) fd.append('meta_votos', metaVotos);
    const foto = document.getElementById('c-foto').files[0];
    if (foto) fd.append('foto', foto);

    const res = await fetch(API + '/api/admin/config/candidatos', {
      method: 'POST', headers: { Authorization: 'Bearer ' + getToken() }, body: fd
    });
    if (!res.ok) { const d = await res.json(); throw new Error(d.error || 'Erro'); }

    // Limpa formulário
    ['c-chave','c-nome','c-cargo','c-meta-votos'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('c-ordem').value = '0';
    document.getElementById('c-votos2022').checked = false;
    document.getElementById('c-foto').value = '';
    document.getElementById('c-foto-preview').style.display = 'none';
    btn.textContent = '💾 Salvar candidato';

    okEl.textContent = `Candidato "${nome}" salvo com sucesso!`;
    okEl.style.display = 'block';
    setTimeout(() => okEl.style.display = 'none', 3000);
    carregarCandidatos();
  } catch(e) {
    errEl.textContent = 'Erro: ' + e.message; errEl.style.display = 'block';
    btn.textContent = '💾 Salvar candidato';
  } finally { btn.disabled = false; }
}

/* ── INIT ── */
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('c-foto').addEventListener('change', () => {
    const file = document.getElementById('c-foto').files[0];
    const prev = document.getElementById('c-foto-preview');
    if (file) { prev.src = URL.createObjectURL(file); prev.style.display = 'block'; }
    else prev.style.display = 'none';
  });
  document.getElementById('login-pass').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

  const token = getToken();
  const user  = JSON.parse(localStorage.getItem('user') || '{}');
  if (token && user?.nivel === 'dono') iniciarApp();
});
</script>
</body>
</html>
