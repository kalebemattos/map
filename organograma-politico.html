<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paralax — Organograma Político</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --blue-deep:  #0d2d6b;
  --blue-main:  #1565c0;
  --blue-mid:   #1976d2;
  --blue-light: #e8f0fe;
  --white:      #ffffff;
  --slate-900:  #0f172a;
  --slate-700:  #334155;
  --slate-500:  #64748b;
  --slate-300:  #cbd5e1;
  --accent-grad: linear-gradient(90deg, #60a5fa, #a78bfa);
  --card-bg:    rgba(8,22,58,0.55);
  --card-hover: rgba(12,32,78,0.65);
  --card-border:rgba(255,255,255,0.14);
  --card-border-hover: rgba(255,255,255,0.26);
  --c-blue:   21,101,192;
  --c-green:  5,150,105;
  --c-purple: 124,58,237;
  --c-teal:   13,148,136;
  --c-amber:  217,119,6;
  --ok:   #34d399;
  --warn: #fbbf24;
  --err:  #f87171;
  --r-card: 20px;
  --r-pill: 999px;
  --shadow: 0 8px 32px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.08);
  --font-head: 'Sora', sans-serif;
  --font-body: 'DM Sans', sans-serif;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
html,body { height:100%; }

body {
  font-family: var(--font-body);
  min-height: 100vh;
  background: #071426;
  color: var(--white);
  overflow-x: hidden;
}

.bg-overlay {
  position:fixed; inset:0; z-index:0; pointer-events:none;
  background: linear-gradient(160deg, rgba(6,14,38,.92) 0%, rgba(10,26,60,.84) 40%, rgba(13,45,107,.74) 100%);
}
.orb {
  position:fixed; border-radius:50%; filter:blur(80px);
  opacity:0; pointer-events:none; transition:opacity 1.2s ease; z-index:0;
}
.orb.visible { opacity:1; }
.orb-1 { width:520px;height:520px; background:radial-gradient(circle,rgba(21,101,192,.28) 0%,transparent 70%); top:-120px;left:-120px; }
.orb-2 { width:400px;height:400px; background:radial-gradient(circle,rgba(124,58,237,.18) 0%,transparent 70%); bottom:-80px;right:-60px; }
.orb-3 { width:300px;height:300px; background:radial-gradient(circle,rgba(96,165,250,.14) 0%,transparent 70%); top:40%;left:50%;transform:translate(-50%,-50%); }

#app {
  position:relative; z-index:1;
  display:flex; flex-direction:column; min-height:100vh;
  padding-bottom:72px;
}

/* NAV */
.top-nav {
  display:flex; align-items:center; justify-content:space-between;
  padding:18px 40px;
  background:rgba(7,20,38,.75); backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(255,255,255,.08);
  position:sticky; top:0; z-index:100;
  animation: fadeDown .5s ease both;
}
.nav-brand { display:flex; align-items:center; gap:10px; }
.nav-logo {
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg,var(--blue-main),#42a5f5);
  display:flex; align-items:center; justify-content:center;
  font-size:18px; box-shadow:0 4px 14px rgba(21,101,192,.5);
}
.nav-name { font-family:var(--font-head); font-size:16px; font-weight:700; color:rgba(255,255,255,.92); letter-spacing:-.2px; }
.nav-badge {
  font-size:11px; font-weight:600; color:rgba(255,255,255,.4);
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.1);
  padding:3px 10px; border-radius:20px; letter-spacing:.5px; text-transform:uppercase;
}
.nav-center { display:flex; flex-direction:column; align-items:center; }
.campaign-title {
  font-family:var(--font-head); font-size:20px; font-weight:800; letter-spacing:-.5px;
  background:var(--accent-grad); -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  outline:none; min-width:100px; text-align:center;
}
.campaign-title[contenteditable="true"]:hover,
.campaign-title[contenteditable="true"]:focus {
  background:none; -webkit-text-fill-color:rgba(255,255,255,.9);
  background-color:rgba(255,255,255,.07); border-radius:6px; padding:2px 10px;
}
.nav-actions { display:flex; gap:8px; align-items:center; }

/* BUTTONS */
.btn {
  font-family:var(--font-body); font-size:12px; font-weight:600; letter-spacing:.04em;
  padding:7px 16px; border-radius:var(--r-pill); border:none; cursor:pointer;
  display:inline-flex; align-items:center; gap:5px;
  transition:all .2s cubic-bezier(.34,1.56,.64,1);
}
.btn-ghost {
  background:rgba(255,255,255,.07); color:rgba(255,255,255,.7);
  border:1px solid rgba(255,255,255,.14);
}
.btn-ghost:hover { background:rgba(255,255,255,.14); color:#fff; transform:translateY(-1px); }
.btn-primary {
  background:linear-gradient(135deg,var(--blue-deep),var(--blue-main));
  color:#fff; box-shadow:0 4px 14px rgba(21,101,192,.4);
}
.btn-primary:hover { opacity:.9; transform:translateY(-1px); }
.btn-danger { background:rgba(239,68,68,.15); color:#f87171; border:1px solid rgba(239,68,68,.25); }
.btn-danger:hover { background:rgba(239,68,68,.28); }
.btn-sm { font-size:11px; padding:5px 12px; }

.badge-role { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; padding:4px 12px; border-radius:var(--r-pill); }
.badge-dono   { background:rgba(217,119,6,.18); color:#fbbf24; border:1px solid rgba(217,119,6,.3); }
.badge-admin  { background:rgba(21,101,192,.18); color:#60a5fa; border:1px solid rgba(21,101,192,.3); }
.badge-viewer { background:rgba(255,255,255,.07); color:rgba(255,255,255,.45); border:1px solid rgba(255,255,255,.12); }

/* HERO */
.hero {
  display:flex; flex-direction:column; align-items:center;
  padding:44px 24px 28px; text-align:center;
  animation:fadeUp .6s ease .1s both;
}
.hero-eyebrow {
  display:inline-flex; align-items:center; gap:6px;
  font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
  color:rgba(255,255,255,.4); margin-bottom:18px;
}
.hero-eyebrow::before,.hero-eyebrow::after { content:''; width:24px; height:1px; background:rgba(255,255,255,.2); }
.coord-block {
  background:var(--card-bg); backdrop-filter:blur(20px);
  border:1px solid rgba(96,165,250,.25); border-radius:22px;
  padding:22px 52px; box-shadow:var(--shadow), 0 0 40px rgba(21,101,192,.1);
  position:relative; overflow:hidden;
}
.coord-block::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.08) 0%,transparent 55%);
  pointer-events:none; border-radius:inherit;
}
.coord-block::after {
  content:''; position:absolute; top:0; left:20px; right:20px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(96,165,250,.35),transparent);
}
.coord-name {
  font-family:var(--font-head); font-size:28px; font-weight:800; letter-spacing:-.5px; outline:none;
}
.coord-name[contenteditable="true"]:focus { background:rgba(255,255,255,.05); border-radius:4px; padding:0 8px; }
.coord-sub { font-size:12px; color:rgba(96,165,250,.8); letter-spacing:.08em; text-transform:uppercase; font-weight:600; margin-top:4px; }
.connector { width:2px; height:28px; margin:0 auto; background:linear-gradient(to bottom,rgba(96,165,250,.4),transparent); }

/* AREAS */
.areas-section { padding:0 24px 28px; }
.areas-title { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.3); text-align:center; margin-bottom:14px; }
.areas-strip { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.area-chip {
  background:rgba(8,22,58,.6); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.13); border-radius:var(--r-pill);
  padding:7px 18px; font-size:13px; font-weight:500;
  display:flex; align-items:center; gap:8px; transition:border-color .2s;
}
.area-chip:hover { border-color:rgba(96,165,250,.3); }
.area-chip-name { outline:none; min-width:50px; }
.area-chip-name[contenteditable="true"]:focus { background:rgba(255,255,255,.06); border-radius:4px; padding:0 4px; }
.area-remove {
  width:18px; height:18px; border-radius:50%; background:rgba(248,113,113,.15); color:#f87171;
  border:none; cursor:pointer; font-size:11px; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .15s;
}
.area-chip:hover .area-remove { opacity:1; }
.area-add-btn {
  background:transparent; border:1px dashed rgba(255,255,255,.18); border-radius:var(--r-pill);
  padding:7px 18px; color:rgba(255,255,255,.35); font-size:13px; cursor:pointer; transition:all .2s;
}
.area-add-btn:hover { border-color:rgba(96,165,250,.5); color:rgba(96,165,250,.9); }

/* BLOCOS */
.blocos-wrap { display:flex; flex-direction:column; gap:20px; padding:0 24px; max-width:1100px; margin:0 auto; width:100%; }

.bloco {
  background:var(--card-bg); backdrop-filter:blur(20px);
  border:1px solid var(--card-border); border-radius:var(--r-card);
  padding:26px; box-shadow:var(--shadow);
  position:relative; overflow:hidden;
  animation:fadeUp .5s ease both;
  transition:border-color .2s;
}
.bloco::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(135deg,rgba(255,255,255,.07) 0%,transparent 55%);
  pointer-events:none; border-radius:inherit;
}
.bloco::after {
  content:''; position:absolute; top:0; left:20px; right:20px; height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.15),transparent);
}
.bloco:hover { border-color:var(--card-border-hover); }
.bloco-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; position:relative; z-index:1; }
.bloco-title-wrap { display:flex; align-items:center; gap:12px; }
.bloco-pill { font-size:9px; font-weight:700; letter-spacing:.15em; text-transform:uppercase; padding:4px 12px; border-radius:var(--r-pill); }
.pill-slot  { background:rgba(var(--c-blue),.18); color:#60a5fa; border:1px solid rgba(var(--c-blue),.3); }
.pill-lista { background:rgba(var(--c-teal),.18); color:#5eead4; border:1px solid rgba(var(--c-teal),.3); }
.bloco-title { font-family:var(--font-head); font-size:17px; font-weight:700; outline:none; color:rgba(255,255,255,.97); }
.bloco-title[contenteditable="true"]:focus { background:rgba(255,255,255,.06); border-radius:4px; padding:0 6px; }
.bloco-actions { display:flex; gap:8px; }

/* SLOT GRID */
.slots-grid { display:flex; gap:12px; flex-wrap:wrap; position:relative; z-index:1; }
.slot-card {
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
  border-radius:16px; padding:16px 18px;
  min-width:175px; flex:1; position:relative;
  transition:transform .22s cubic-bezier(.34,1.56,.64,1), border-color .2s, background .2s, box-shadow .2s;
  animation:fadeUp .4s ease both;
}
.slot-card:hover {
  transform:translateY(-3px) scale(1.01); background:rgba(255,255,255,.07);
  border-color:rgba(96,165,250,.28);
  box-shadow:0 12px 32px rgba(0,0,0,.35), 0 0 18px rgba(21,101,192,.1);
}
.slot-name { font-family:var(--font-head); font-size:14px; font-weight:700; color:rgba(255,255,255,.97); outline:none; display:block; }
.slot-name[contenteditable="true"]:focus { background:rgba(255,255,255,.06); border-radius:3px; padding:0 4px; }
.slot-resp { font-size:12px; color:rgba(255,255,255,.45); outline:none; display:block; margin-top:2px; }
.slot-resp[contenteditable="true"]:focus { background:rgba(255,255,255,.05); border-radius:3px; }
.slot-numbers { display:flex; gap:8px; margin-top:10px; }
.slot-input-wrap { flex:1; display:flex; flex-direction:column; gap:2px; }
.slot-input-label { font-size:9px; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.1em; }
.slot-input {
  background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1);
  border-radius:8px; padding:5px 8px;
  color:rgba(255,255,255,.9); font-family:var(--font-body); font-size:13px; font-weight:500;
  width:100%; outline:none; transition:all .15s;
}
.slot-input:focus { border-color:rgba(96,165,250,.5); background:rgba(21,101,192,.08); }
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
input[type=number] { -moz-appearance:textfield; }
.slot-bar-wrap { margin-top:10px; }
.slot-bar-bg { height:3px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
.slot-bar-fill { height:100%; border-radius:99px; transition:width .4s ease, background .4s ease; }
.slot-bar-pct { font-size:10px; text-align:right; margin-top:3px; font-variant-numeric:tabular-nums; }
.slot-remove {
  position:absolute; top:10px; right:10px;
  width:20px; height:20px; border-radius:50%;
  background:rgba(248,113,113,.15); color:#f87171; border:none; cursor:pointer; font-size:12px;
  display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity .15s;
}
.slot-card:hover .slot-remove { opacity:1; }

/* LISTA */
.lista-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(248px,1fr)); gap:12px; position:relative; z-index:1; }
.lista-card {
  background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.1);
  border-radius:16px; padding:16px; transition:border-color .2s, background .2s;
  animation:fadeUp .4s ease both; position:relative;
}
.lista-card:hover { background:rgba(255,255,255,.07); border-color:rgba(94,234,212,.25); }
.lista-card-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.lista-zona-name { font-family:var(--font-head); font-size:13px; font-weight:700; outline:none; }
.lista-zona-name[contenteditable="true"]:focus { background:rgba(255,255,255,.06); border-radius:3px; padding:0 4px; }
.lista-zona-remove { opacity:0; transition:opacity .15s; }
.lista-card:hover .lista-zona-remove { opacity:1; }
.lista-items { display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
.lista-item { display:flex; align-items:center; gap:6px; font-size:12px; color:rgba(255,255,255,.5); }
.lista-item::before { content:''; width:4px; height:4px; border-radius:50%; background:#5eead4; flex-shrink:0; }
.lista-item-text { outline:none; flex:1; }
.lista-item-text[contenteditable="true"]:focus { color:rgba(255,255,255,.9); background:rgba(255,255,255,.05); border-radius:3px; padding:0 4px; }
.lista-item-del {
  width:15px; height:15px; border-radius:50%; background:rgba(248,113,113,.15); color:#f87171;
  border:none; cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .15s; flex-shrink:0;
}
.lista-item:hover .lista-item-del { opacity:1; }
.lista-add-bairro {
  background:none; border:1px dashed rgba(94,234,212,.25); border-radius:7px; padding:5px 10px;
  color:rgba(94,234,212,.7); font-size:11px; cursor:pointer; width:100%; text-align:left; transition:all .15s;
}
.lista-add-bairro:hover { background:rgba(13,148,136,.1); color:#5eead4; }
.lista-numbers { display:flex; gap:8px; margin-top:10px; }
.lista-input-wrap { flex:1; display:flex; flex-direction:column; gap:2px; }
.lista-input-label { font-size:9px; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.1em; }
.lista-input {
  background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.1);
  border-radius:7px; padding:4px 8px;
  color:rgba(255,255,255,.9); font-family:var(--font-body); font-size:12px;
  width:100%; outline:none; transition:all .15s;
}
.lista-input:focus { border-color:rgba(94,234,212,.4); }

/* ADD BLOCO */
.add-bloco-row { display:flex; gap:10px; justify-content:center; padding:20px 24px 0; max-width:1100px; margin:0 auto; width:100%; }

/* TOTALS */
.totals-bar {
  position:fixed; bottom:0; left:0; right:0; z-index:100;
  background:rgba(7,14,30,.9); backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.08);
  padding:10px 40px; display:flex; align-items:center; justify-content:space-between;
}
.totals-label { font-size:10px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:rgba(255,255,255,.3); }
.totals-numbers { display:flex; gap:32px; }
.total-item { display:flex; flex-direction:column; align-items:center; gap:1px; }
.total-val  { font-family:var(--font-head); font-size:20px; font-weight:800; color:#60a5fa; }
.total-key  { font-size:10px; color:rgba(255,255,255,.3); text-transform:uppercase; letter-spacing:.1em; }

/* TOAST */
.toast {
  position:fixed; bottom:72px; right:20px; z-index:200;
  background:rgba(8,22,58,.88); backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.14); border-radius:12px;
  padding:11px 18px; font-size:13px; color:rgba(255,255,255,.9);
  display:flex; align-items:center; gap:8px; box-shadow:var(--shadow);
  transform:translateX(130%); transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.toast.show { transform:translateX(0); }

/* ANIMS */
@keyframes fadeUp   { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
@keyframes fadeDown { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }

/* VIEW-ONLY */
body.view-only [contenteditable] { pointer-events:none; }
body.view-only input { pointer-events:none; }
body.view-only .edit-only { display:none !important; }
body.view-only .slot-remove, body.view-only .lista-zona-remove, body.view-only .area-remove { display:none !important; }

::-webkit-scrollbar { width:5px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:rgba(255,255,255,.12); border-radius:99px; }

@media(max-width:860px){
  .top-nav { padding:14px 18px; }
  .nav-center { display:none; }
  .blocos-wrap,.add-bloco-row { padding-left:14px; padding-right:14px; }
  .slots-grid { flex-direction:column; }
  .lista-grid { grid-template-columns:1fr; }
  .totals-numbers { gap:18px; }
  .total-val { font-size:16px; }
}
</style>
</head>
<body>

<div class="bg-overlay"></div>
<div class="orb orb-1" id="orb-1"></div>
<div class="orb orb-2" id="orb-2"></div>
<div class="orb orb-3" id="orb-3"></div>

<div class="toast" id="toast">⚡ <span id="toast-msg">Salvo!</span></div>

<div id="app">
  <nav class="top-nav">
    <div class="nav-brand">
      <div class="nav-logo">🗺️</div>
      <div class="nav-name">Paralax</div>
      <div class="nav-badge">Gestão Política</div>
    </div>
    <div class="nav-center">
      <div class="campaign-title" id="campaign-title" contenteditable="true" spellcheck="false">CAMPANHA 2026</div>
    </div>
    <div class="nav-actions">
      <span class="badge-role badge-dono" id="role-badge">Dono</span>
      <button class="btn btn-ghost btn-sm" onclick="carregarSistema()">↓ Carregar</button>
      <button class="btn btn-primary btn-sm" onclick="salvarSistema()">↑ Salvar</button>
    </div>
  </nav>

  <div class="hero">
    <div class="hero-eyebrow">Coordenação Geral</div>
    <div class="coord-block">
      <div class="coord-name" id="coord-nome" contenteditable="true" spellcheck="false">Nome do Coordenador</div>
      <div class="coord-sub">Coordenador(a) de Campanha</div>
    </div>
  </div>

  <div class="connector"></div>

  <div class="areas-section">
    <div class="areas-title">Áreas de Apoio</div>
    <div class="areas-strip" id="areas-strip"></div>
  </div>

  <div class="connector"></div>

  <div class="blocos-wrap" id="blocos-wrap"></div>

  <div class="add-bloco-row">
    <button class="btn btn-ghost btn-sm edit-only" onclick="adicionarBloco('slot')">＋ Bloco Lideranças</button>
    <button class="btn btn-ghost btn-sm edit-only" onclick="adicionarBloco('lista')">＋ Bloco Zonas</button>
  </div>
</div>

<div class="totals-bar">
  <div class="totals-label">Painel de Resultados</div>
  <div class="totals-numbers">
    <div class="total-item">
      <div class="total-val" id="total-votos">0</div>
      <div class="total-key">Total Votos</div>
    </div>
    <div class="total-item">
      <div class="total-val" id="total-meta" style="color:rgba(255,255,255,.35)">0</div>
      <div class="total-key">Meta Total</div>
    </div>
    <div class="total-item">
      <div class="total-val" id="total-pct">0%</div>
      <div class="total-key">Atingido</div>
    </div>
  </div>
</div>

<script>
window.USUARIO_NIVEL = window.USUARIO_NIVEL ?? 'dono';
window.TENANT_ID     = window.TENANT_ID     ?? 'tenant_demo';

let sistema = {
  tenant_id: window.TENANT_ID, titulo:'CAMPANHA 2026', coordenacao:'Nome do Coordenador',
  areas:['Financeiro','Comunicação','Jurídico','Saúde','Educação','Mobilização'],
  blocos:[]
};
let podeEditar = false;

function init() {
  const nivel = window.USUARIO_NIVEL;
  podeEditar = nivel==='dono'||nivel==='admin';
  const badge=document.getElementById('role-badge');
  if(nivel==='dono')       {badge.textContent='Dono'; badge.className='badge-role badge-dono';}
  else if(nivel==='admin') {badge.textContent='Admin';badge.className='badge-role badge-admin';}
  else {badge.textContent=nivel??'Visualizador';badge.className='badge-role badge-viewer';}
  if(!podeEditar) document.body.classList.add('view-only');
  if(sistema.blocos.length===0) criarBlocosIniciais();
  renderAreas(); renderTodosBlocos(); atualizarTotais();
  document.getElementById('campaign-title').textContent=sistema.titulo;
  document.getElementById('coord-nome').textContent=sistema.coordenacao;
  if(podeEditar){
    document.getElementById('campaign-title').addEventListener('input',e=>{sistema.titulo=e.target.textContent.trim();});
    document.getElementById('coord-nome').addEventListener('input',e=>{sistema.coordenacao=e.target.textContent.trim();});
  } else {
    document.getElementById('campaign-title').removeAttribute('contenteditable');
    document.getElementById('coord-nome').removeAttribute('contenteditable');
  }
  setTimeout(()=>document.querySelectorAll('.orb').forEach((o,i)=>setTimeout(()=>o.classList.add('visible'),i*300)),300);
}

function criarBlocosIniciais() {
  sistema.blocos=[
    {id:uid(),tipo:'slot',titulo:'Coordenação Municipal',slots:[
      {id:uid(),nome:'Zona Norte',resp:'Ricardo Almeida',votos:1200,meta:2000},
      {id:uid(),nome:'Zona Sul',  resp:'Fernanda Costa', votos:980, meta:1500},
      {id:uid(),nome:'Zona Leste',resp:'Paulo Mendes',   votos:740, meta:1200},
      {id:uid(),nome:'Zona Oeste',resp:'Ana Souza',      votos:620, meta:1000},
      {id:uid(),nome:'Centro',    resp:'Carlos Lima',    votos:890, meta:1100},
    ]},
    {id:uid(),tipo:'slot',titulo:'Líderes Distritais',slots:[
      {id:uid(),nome:'Distrito 1',resp:'Marcos Vieira', votos:310,meta:500},
      {id:uid(),nome:'Distrito 2',resp:'Juliana Prado', votos:280,meta:450},
      {id:uid(),nome:'Distrito 3',resp:'Diego Ramos',   votos:195,meta:400},
      {id:uid(),nome:'Distrito 4',resp:'Letícia Cunha', votos:420,meta:600},
      {id:uid(),nome:'Distrito 5',resp:'Thiago Borges', votos:350,meta:550},
      {id:uid(),nome:'Distrito 6',resp:'Camila Nunes',  votos:270,meta:480},
    ]},
    {id:uid(),tipo:'lista',titulo:'Zonas & Bairros',zonas:[
      {id:uid(),nome:'Zona 1 — Norte',bairros:['Bairro Alto','Vila Formosa','Jardim Esperança'],votos:850,meta:1200},
      {id:uid(),nome:'Zona 2 — Sul',  bairros:['Centro Histórico','Boa Vista','São Jorge'],    votos:640,meta:900},
      {id:uid(),nome:'Zona 3 — Leste',bairros:['Parque Industrial','Nova Cidade','Palmares'],  votos:510,meta:800},
      {id:uid(),nome:'Zona 4 — Oeste',bairros:['Jardim São Paulo','Vila Real'],                votos:390,meta:700},
      {id:uid(),nome:'Zona 5 — Centro',bairros:['Praia Grande','Mangabeira','Pinheiros'],      votos:720,meta:1000},
    ]},
  ];
}

function uid() { return '_'+Math.random().toString(36).substr(2,9); }
function pct(v,m) { if(!m)return 0; return Math.min(100,Math.round((v/m)*100)); }
function barColor(p) {
  if(p>=80)return'linear-gradient(90deg,#34d399,#5eead4)';
  if(p>=50)return'linear-gradient(90deg,#fbbf24,#34d399)';
  return'linear-gradient(90deg,#f87171,#fbbf24)';
}
function pctColor(p) { if(p>=80)return'#34d399'; if(p>=50)return'#fbbf24'; return'#f87171'; }

function renderAreas() {
  const strip=document.getElementById('areas-strip');
  strip.innerHTML='';
  sistema.areas.forEach((area,i)=>{
    const chip=document.createElement('div'); chip.className='area-chip';
    chip.innerHTML=`<span class="area-chip-name" ${podeEditar?'contenteditable="true"':''} spellcheck="false">${area}</span>${podeEditar?`<button class="area-remove edit-only" onclick="removerArea(${i})">✕</button>`:''}`;
    chip.querySelector('.area-chip-name')?.addEventListener('input',e=>{sistema.areas[i]=e.target.textContent.trim();});
    strip.appendChild(chip);
  });
  if(podeEditar){
    const btn=document.createElement('button'); btn.className='area-add-btn edit-only'; btn.textContent='+ Área';
    btn.onclick=()=>{sistema.areas.push('Nova Área');renderAreas();};
    strip.appendChild(btn);
  }
}
function removerArea(i){sistema.areas.splice(i,1);renderAreas();}

function renderTodosBlocos(){
  const wrap=document.getElementById('blocos-wrap'); wrap.innerHTML='';
  sistema.blocos.forEach(b=>wrap.appendChild(renderBloco(b)));
}

function renderBloco(bloco){
  const div=document.createElement('div'); div.className='bloco'; div.id='bloco-'+bloco.id;
  const tipo=bloco.tipo;
  const pillCls=tipo==='slot'?'pill-slot':'pill-lista';
  const pillTxt=tipo==='slot'?'Lideranças':'Territórios';
  div.innerHTML=`
    <div class="bloco-header">
      <div class="bloco-title-wrap">
        <span class="bloco-pill ${pillCls}">${pillTxt}</span>
        <span class="bloco-title" ${podeEditar?'contenteditable="true"':''} spellcheck="false">${bloco.titulo}</span>
      </div>
      ${podeEditar?`<div class="bloco-actions edit-only">
        <button class="btn btn-ghost btn-sm" onclick="duplicarBloco('${bloco.id}')">⧉ Duplicar</button>
        <button class="btn btn-danger btn-sm" onclick="removerBloco('${bloco.id}')">✕</button>
      </div>`:''}
    </div>
    <div id="body-${bloco.id}"></div>
    ${podeEditar&&tipo==='slot'?`<div style="margin-top:12px;position:relative;z-index:1"><button class="btn btn-ghost btn-sm edit-only" onclick="adicionarSlot('${bloco.id}')">＋ Slot</button></div>`:''}
    ${podeEditar&&tipo==='lista'?`<div style="margin-top:12px;position:relative;z-index:1"><button class="btn btn-ghost btn-sm edit-only" onclick="adicionarZona('${bloco.id}')">＋ Zona</button></div>`:''}
  `;
  div.querySelector('.bloco-title')?.addEventListener('input',e=>{bloco.titulo=e.target.textContent.trim();});
  const body=div.querySelector(`#body-${bloco.id}`);
  if(tipo==='slot') renderSlotsGrid(body,bloco);
  if(tipo==='lista') renderListaGrid(body,bloco);
  return div;
}

function renderSlotsGrid(container,bloco){
  container.innerHTML='';
  const grid=document.createElement('div'); grid.className='slots-grid';
  (bloco.slots||[]).forEach(slot=>{
    const p=pct(slot.votos,slot.meta);
    const card=document.createElement('div'); card.className='slot-card'; card.id='slot-'+slot.id;
    card.innerHTML=`
      ${podeEditar?`<button class="slot-remove edit-only" onclick="removerSlot('${bloco.id}','${slot.id}')">✕</button>`:''}
      <span class="slot-name" ${podeEditar?'contenteditable="true"':''} spellcheck="false">${slot.nome}</span>
      <span class="slot-resp" ${podeEditar?'contenteditable="true"':''} spellcheck="false">${slot.resp}</span>
      <div class="slot-numbers">
        <div class="slot-input-wrap"><span class="slot-input-label">Votos</span>
          <input class="slot-input" type="number" value="${slot.votos}" ${!podeEditar?'readonly':''} data-field="votos" data-bloco="${bloco.id}" data-slot="${slot.id}">
        </div>
        <div class="slot-input-wrap"><span class="slot-input-label">Meta</span>
          <input class="slot-input" type="number" value="${slot.meta}" ${!podeEditar?'readonly':''} data-field="meta" data-bloco="${bloco.id}" data-slot="${slot.id}">
        </div>
      </div>
      <div class="slot-bar-wrap">
        <div class="slot-bar-bg"><div class="slot-bar-fill" style="width:${p}%;background:${barColor(p)}"></div></div>
        <div class="slot-bar-pct" style="color:${pctColor(p)}">${p}%</div>
      </div>`;
    card.querySelectorAll('.slot-input').forEach(inp=>inp.addEventListener('input',e=>{
      slot[e.target.dataset.field]=parseInt(e.target.value)||0;
      atualizarBarraSlot(bloco.id,slot.id); atualizarTotais();
    }));
    card.querySelector('.slot-name')?.addEventListener('input',e=>{slot.nome=e.target.textContent.trim();});
    card.querySelector('.slot-resp')?.addEventListener('input',e=>{slot.resp=e.target.textContent.trim();});
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

function atualizarBarraSlot(bId,sId){
  const b=sistema.blocos.find(b=>b.id===bId); const s=(b?.slots||[]).find(s=>s.id===sId);
  const card=document.getElementById('slot-'+sId); if(!s||!card)return;
  const p=pct(s.votos,s.meta);
  card.querySelector('.slot-bar-fill').style.width=p+'%';
  card.querySelector('.slot-bar-fill').style.background=barColor(p);
  card.querySelector('.slot-bar-pct').textContent=p+'%';
  card.querySelector('.slot-bar-pct').style.color=pctColor(p);
}

function adicionarSlot(bId){
  const b=sistema.blocos.find(b=>b.id===bId); if(!b)return;
  b.slots.push({id:uid(),nome:'Novo Slot',resp:'Responsável',votos:0,meta:300});
  renderSlotsGrid(document.getElementById('body-'+bId),b); atualizarTotais();
}
function removerSlot(bId,sId){
  const b=sistema.blocos.find(b=>b.id===bId); if(!b)return;
  b.slots=b.slots.filter(s=>s.id!==sId);
  renderSlotsGrid(document.getElementById('body-'+bId),b); atualizarTotais();
}

function renderListaGrid(container,bloco){
  container.innerHTML='';
  const grid=document.createElement('div'); grid.className='lista-grid';
  (bloco.zonas||[]).forEach(zona=>{
    const p=pct(zona.votos,zona.meta);
    const card=document.createElement('div'); card.className='lista-card';
    card.innerHTML=`
      <div class="lista-card-header">
        <span class="lista-zona-name" ${podeEditar?'contenteditable="true"':''} spellcheck="false">${zona.nome}</span>
        ${podeEditar?`<button class="btn btn-danger btn-sm lista-zona-remove edit-only" onclick="removerZona('${bloco.id}','${zona.id}')">✕</button>`:''}
      </div>
      <div class="lista-items" id="items-${zona.id}"></div>
      ${podeEditar?`<button class="lista-add-bairro edit-only" onclick="adicionarBairro('${bloco.id}','${zona.id}')">+ bairro</button>`:''}
      <div class="lista-numbers">
        <div class="lista-input-wrap"><span class="lista-input-label">Votos</span>
          <input class="lista-input" type="number" value="${zona.votos}" ${!podeEditar?'readonly':''} data-bloco="${bloco.id}" data-zona="${zona.id}" data-field="votos">
        </div>
        <div class="lista-input-wrap"><span class="lista-input-label">Meta</span>
          <input class="lista-input" type="number" value="${zona.meta}" ${!podeEditar?'readonly':''} data-bloco="${bloco.id}" data-zona="${zona.id}" data-field="meta">
        </div>
      </div>
      <div class="slot-bar-wrap">
        <div class="slot-bar-bg"><div class="slot-bar-fill" style="width:${p}%;background:${barColor(p)}"></div></div>
        <div class="slot-bar-pct" style="color:${pctColor(p)}">${p}%</div>
      </div>`;
    renderBairros(card.querySelector(`#items-${zona.id}`),bloco,zona);
    card.querySelectorAll('.lista-input').forEach(inp=>inp.addEventListener('input',e=>{
      zona[e.target.dataset.field]=parseInt(e.target.value)||0;
      const p2=pct(zona.votos,zona.meta);
      card.querySelector('.slot-bar-fill').style.width=p2+'%';
      card.querySelector('.slot-bar-fill').style.background=barColor(p2);
      card.querySelector('.slot-bar-pct').textContent=p2+'%';
      card.querySelector('.slot-bar-pct').style.color=pctColor(p2);
      atualizarTotais();
    }));
    card.querySelector('.lista-zona-name')?.addEventListener('input',e=>{zona.nome=e.target.textContent.trim();});
    grid.appendChild(card);
  });
  container.appendChild(grid);
}

function renderBairros(container,bloco,zona){
  container.innerHTML='';
  (zona.bairros||[]).forEach((b,bi)=>{
    const item=document.createElement('div'); item.className='lista-item';
    item.innerHTML=`<span class="lista-item-text" ${podeEditar?'contenteditable="true"':''} spellcheck="false">${b}</span>${podeEditar?`<button class="lista-item-del edit-only" onclick="removerBairro('${bloco.id}','${zona.id}',${bi})">✕</button>`:''}`;
    item.querySelector('.lista-item-text')?.addEventListener('input',e=>{zona.bairros[bi]=e.target.textContent.trim();});
    container.appendChild(item);
  });
}

function adicionarZona(bId){
  const b=sistema.blocos.find(b=>b.id===bId); if(!b)return;
  b.zonas.push({id:uid(),nome:'Nova Zona',bairros:['Novo Bairro'],votos:0,meta:300});
  renderListaGrid(document.getElementById('body-'+bId),b); atualizarTotais();
}
function removerZona(bId,zId){
  const b=sistema.blocos.find(b=>b.id===bId); if(!b)return;
  b.zonas=b.zonas.filter(z=>z.id!==zId);
  renderListaGrid(document.getElementById('body-'+bId),b); atualizarTotais();
}
function adicionarBairro(bId,zId){
  const b=sistema.blocos.find(b=>b.id===bId); const z=(b?.zonas||[]).find(z=>z.id===zId); if(!z)return;
  z.bairros.push('Novo Bairro');
  renderBairros(document.getElementById('items-'+zId),b,z);
}
function removerBairro(bId,zId,bi){
  const b=sistema.blocos.find(b=>b.id===bId); const z=(b?.zonas||[]).find(z=>z.id===zId); if(!z)return;
  z.bairros.splice(bi,1);
  renderBairros(document.getElementById('items-'+zId),b,z);
}

function adicionarBloco(tipo){
  const novo={id:uid(),tipo,titulo:tipo==='slot'?'Novo Bloco de Lideranças':'Novo Bloco de Zonas',
    slots:tipo==='slot'?[{id:uid(),nome:'Slot 1',resp:'Responsável',votos:0,meta:300}]:undefined,
    zonas:tipo==='lista'?[{id:uid(),nome:'Zona 1',bairros:['Bairro A'],votos:0,meta:200}]:undefined};
  sistema.blocos.push(novo);
  const el=renderBloco(novo); document.getElementById('blocos-wrap').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'center'});
}
function removerBloco(id){
  sistema.blocos=sistema.blocos.filter(b=>b.id!==id);
  document.getElementById('bloco-'+id)?.remove(); atualizarTotais();
}
function duplicarBloco(id){
  const b=sistema.blocos.find(b=>b.id===id); if(!b)return;
  const clone=JSON.parse(JSON.stringify(b)); clone.id=uid(); clone.titulo=b.titulo+' (cópia)';
  if(clone.slots) clone.slots=clone.slots.map(s=>({...s,id:uid()}));
  if(clone.zonas) clone.zonas=clone.zonas.map(z=>({...z,id:uid()}));
  sistema.blocos.push(clone);
  const el=renderBloco(clone); document.getElementById('blocos-wrap').appendChild(el);
  el.scrollIntoView({behavior:'smooth',block:'center'});
}

function atualizarTotais(){
  let tv=0,tm=0;
  sistema.blocos.forEach(b=>{
    if(b.tipo==='slot')(b.slots||[]).forEach(s=>{tv+=s.votos||0;tm+=s.meta||0;});
    if(b.tipo==='lista')(b.zonas||[]).forEach(z=>{tv+=z.votos||0;tm+=z.meta||0;});
  });
  const p=pct(tv,tm);
  document.getElementById('total-votos').textContent=tv.toLocaleString('pt-BR');
  document.getElementById('total-meta').textContent=tm.toLocaleString('pt-BR');
  const pEl=document.getElementById('total-pct');
  pEl.textContent=p+'%'; pEl.style.color=pctColor(p);
}

function salvarSistema(){
  sistema.titulo=document.getElementById('campaign-title').textContent.trim();
  sistema.coordenacao=document.getElementById('coord-nome').textContent.trim();
  // → POST /api/organograma + Authorization: Bearer <token>
  try{localStorage.setItem('paralax_org_'+sistema.tenant_id,JSON.stringify(sistema));}catch{}
  toast('✅ Organograma salvo!');
}
function carregarSistema(){
  // → GET /api/organograma?tenant_id=...
  try{
    const raw=localStorage.getItem('paralax_org_'+sistema.tenant_id);
    if(raw){
      sistema=JSON.parse(raw); sistema.tenant_id=window.TENANT_ID;
      document.getElementById('campaign-title').textContent=sistema.titulo;
      document.getElementById('coord-nome').textContent=sistema.coordenacao;
      renderAreas(); renderTodosBlocos(); atualizarTotais();
      toast('📂 Carregado com sucesso!');
    }else{toast('⚠️ Nenhum dado salvo.');}
  }catch{toast('❌ Erro ao carregar.');}
}

function toast(msg){
  const t=document.getElementById('toast'); document.getElementById('toast-msg').textContent=msg;
  t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800);
}

init();
</script>
</body>
</html>
